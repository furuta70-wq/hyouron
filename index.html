いているかを見る。意味と機能を分けて考えることが大切である。","keywords":[["神話","世界や共同体の起源、神や祖先などを語り、価値や秩序に意味を与える物語。"],["儀礼","一定の形式や反復を通して、節目や価値、共同体との関係を表す行為。"],["聖","日常から区別され、特別な価値や規則と結びつけられたもの。"],["俗","日常生活の通常の領域として扱われるもの。聖との区別によって意味をもつ。"],["共同体","共通の所属や関係をもち、一定の価値や実践を共有する人々のまとまり。"]]},{"id":118,"area":"X","areaName":"宗教・死生・超越","title":"世俗化・宗教と社会","question":"近代化が進めば宗教は次第に消えていく、と考えられた時期がある。しかし、信仰が残る社会もあれば、政治と宗教が強く関わる社会もある。世俗化とは、宗教がなくなることなのか、それとも宗教と社会の関係が変わることなのか。","body":"世俗化には複数の意味がある。礼拝や宗教参加が減ること、宗教組織の社会的な影響が弱まること、政治や教育などの制度が宗教組織から分かれることなどである。これらは同じ速度で進むとは限らない。\n\nたとえば、国家が特定の宗教を公式には支持しなくても、市民の多くが個人的な信仰を持つことはできる。逆に、宗教参加が少なくても、宗教由来の休日や価値観が社会制度に残る場合もある。宗教の影響は数字だけでは測れない。\n\n私的な信仰と公共の制度をどこまで分けるかも難しい問題である。国家が宗教を強制しないことと、信仰を持つ市民が公共的な議論に参加することは両立しうる。何を「宗教的すぎる発言」とするかにも社会差がある。\n\n世俗化を考えるとき、宗教的な価値が別の名前で社会に残る場合もある。勤労観、家族観、生命観など、宗教との歴史的なつながりを持つ価値が、宗教とは意識されず続くこともある。制度上の分離と文化的な影響を分けて見る必要がある。\n\n筆者の主張をつかむには、「宗教が消える過程」と一行で理解しない。宗教、制度、私的領域、公共領域の境界がどう組み替えられているかを見る。何を宗教と呼ぶか自体が論点になっている場合もある。","keywords":[["世俗化","宗教と社会の関係が変化し、宗教参加や制度上の影響などが変わること。"],["制度","政治、教育、家族など、社会の行為を継続的に組織する仕組み。"],["私的","個人や家庭の領域に属するとみなされること。公共的な領域との境界は社会によって異なる。"],["公共","社会の人々に共通して関わり、開かれた議論や制度の対象となる領域。"],["境界","何を宗教的領域とし、何を政治・教育・私生活など別の領域とするかの区切り。"]]},{"id":119,"area":"X","areaName":"宗教・死生・超越","title":"死生観・喪失・弔い","question":"大切な人を失った悲しみには、決まった段階を通って終わる「正しい回復」があるのだろうか。故人を忘れるのではなく、記憶や習慣を通して関係を別の形で続けることもある。死生観と弔いは、喪失をどう受け止めるのか。","body":"死生観とは、生と死をどのように捉え、両者の関係をどのように意味づけるかという基本的な見方である。死を完全な終わりと見るか、別の世界への移行と見るか、記憶の中で関係が続くと見るかで、喪失の意味も変わる。\n\n喪失は、大切な人や物、役割、場所との関係を失うことである。悲嘆は、それに伴う悲しみ、怒り、混乱などの反応を指す。時間がたてば一定の順序で消えるとは限らず、人によって経過は大きく違う。\n\n弔いは、個人の悲しみを社会の中で扱う営みでもある。葬儀や追悼は、死者を記憶し、残された人が喪失を共有する場を作る。故人の習慣を受け継いだり、思い出を語ったりして、関係を別の形で続けることもある。\n\n悲嘆には、仕事や学校へ戻るといった生活上の回復と、心の中で喪失を受け止める過程がある。外からは元気に見えても悲しみが続くことはあるし、悲しみが残っていても日常生活を再び築ける。回復を一つの尺度で測らないことが大切である。\n\n文章を読む際に注目したいのは、「忘れること＝回復」という前提が置かれていないかを見る。筆者が死を個人の問題として扱うのか、共同体の記憶や儀礼と結びつけるのかにも注目する。","keywords":[["死生観","生と死の意味や両者の関係についての基本的な見方。"],["喪失","大切な人、物、役割、場所などとの関係を失うこと。"],["悲嘆","喪失に対して生じる悲しみや混乱などの感情・反応。"],["弔い","死者を記憶し、喪失を社会的に受け止めるための行為や儀礼。"],["記憶","過去の経験を現在から思い出し、意味づけ直す働き。"]]},{"id":120,"area":"X","areaName":"宗教・死生・超越","title":"超越・救済・生の意味","question":"「生きる意味」は、どこかに用意された正解を見つけることなのだろうか。苦しみや死を前にしても、人は宗教、他者との関係、仕事、未来への責任などに意味を見いだすことがある。超越や救済は、生をどう捉え直す考えなのか。","body":"超越とは、現在の自分や日常の範囲を越える存在、価値、目的へ向かうことを指す。宗教では神や絶対的なものとの関係として語られることが多いが、未来世代や他者のために生きることも、自分を越える志向として考えることができる。\n\n救済は、苦しみを単純になくすことだけではない。苦しみや死を含む人生全体を、別の世界観の中で意味づけ直すこととして語られる場合がある。同じ出来事が消えなくても、それとの関係が変わることで生き方が変わることがある。\n\n生の意味も、幸福や成功と同じではない。楽しいことが少なくても、自分の行為が誰かにつながっている、価値ある目的に参加していると感じることで、人生に意味を見いだす人もいる。意味は個人の内面だけで完結しない。\n\n意味を求めることは、必ず大きな使命を見つけることではない。日々の仕事、家族との関係、誰かを支える行為の中に意味を感じることもある。反対に、社会から与えられた成功の基準に従っていても、自分の生に意味を感じられない場合がある。\n\nこの論点を読むときは、意味を「自分の気持ち」の問題だけにしていないかを見る。筆者が他者、共同体、超越的な価値との関係をどこまで含めているかを読む。救済が現実からの逃避として語られるのか、現実の受け止め方を変える働きとして語られるのかも重要である。","keywords":[["超越","現在の自己や日常の範囲を越える存在・価値・目的との関係を志向すること。"],["救済","苦しみや罪、迷いなどから解放され、生の意味を新しく捉え直すこと。"],["生の意味","自分の人生が理解可能で、目的や価値をもち、重要だと感じられることに関わる問い。"],["価値","何を大切で望ましいものとみなすかという基準。"],["世界観","世界や人間の位置、生と死などをどのように理解するかという基本的な見方。"]]}]};
const PALETTE={A:'#3D6EC9',B:'#3C86C7',C:'#2F9AAE',D:'#2E9C88',E:'#3E8D66',F:'#65954F',G:'#8D9442',H:'#A18A3B',I:'#6A61C8',J:'#8158BA',K:'#9B569E',L:'#B45E86',M:'#C4555A',N:'#CC684C',O:'#D27C42',P:'#C67A62',Q:'#D58A35',R:'#BE9A34',S:'#9F8C48',T:'#8D7B5C',U:'#3C8D91',V:'#3F789E',W:'#536CA8',X:'#80639B'};
const articleMap=new Map(DATA.articles.map(a=>[a.id,a])),classMap=new Map(DATA.classification.map(x=>[x.id,x]));
const areas=[...new Map(DATA.classification.map(x=>[x.area,x.areaName])).entries()].map(([area,name])=>({area,name}));
const root=document.getElementById('viewRoot'),sideNav=document.getElementById('sideNav'),indexOverlay=document.getElementById('indexOverlay'),overlayIndex=document.getElementById('overlayIndex'),fontMenu=document.getElementById('fontMenu'),topbar=document.getElementById('topbar'),brandCurrent=document.getElementById('brandCurrent');

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}function sessionGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}function sessionSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function areaTopics(a){return DATA.classification.filter(x=>x.area===a)}function currentArticle(){const m=location.hash.match(/^#article=(\d+)$/);return m?Math.max(1,Math.min(120,+m[1])):null}function currentArea(){const m=location.hash.match(/^#area=([A-X])$/);return m?m[1]:null}
function setTheme(area){document.documentElement.style.setProperty('--theme',PALETTE[area]||'#3D6EC9');document.body.style.setProperty('--page-progress','0');document.body.style.setProperty('--read-progress','0')}
function positionKey(id){return `hyouron:kiso:pos:${id}`}
function saveReadingPosition(){
 const id=currentArticle();if(!id||!document.body.classList.contains('article-mode'))return;
 const paras=[...root.querySelectorAll('.body-text p[data-read-p]')];
 let anchor=null;
 const guide=(topbar?.offsetHeight||56)+54;
 for(const p of paras){if(p.getBoundingClientRect().top<=guide)anchor=p;else break}
 const payload=anchor
   ?{p:+anchor.dataset.readP,delta:Math.round(scrollY-(scrollY+anchor.getBoundingClientRect().top))}
   :{p:-1,delta:Math.round(scrollY)};
 sessionSet(positionKey(id),JSON.stringify(payload));
}
function restoreReadingPosition(id){
 const raw=sessionGet(positionKey(id));if(!raw)return false;
 try{

function setupSpectrumMotion(){
