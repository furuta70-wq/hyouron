」と決めるのではなく、記憶との関係が生活の中でどう変化しているかを見る必要がある。\n\n評論で死生観・喪失・弔いが論じられたら、「忘れること＝回復」という前提が置かれていないかを見る。悲嘆については、個人差を認めず一つの段階や期間へ当てはめていないかを確かめる。弔いでは、個人の感情と共同体の儀礼がどう結びつくかに注目する。そして記憶が、過去にとどまるためのものなのか、死者との関係を組み替えながら現在を生きるためのものなのかを追う。喪失後の生を、元の状態への単純な復帰として読まないことが重要である。","keywords":[["死生観","生と死の意味や両者の関係についての基本的な見方。"],["喪失","大切な人、物、役割、場所などとの関係を失うこと。"],["悲嘆","喪失に対して生じる悲しみや混乱などの感情・反応。"],["弔い","死者を記憶し、喪失を社会的に受け止めるための行為や儀礼。"],["記憶","過去の経験を現在から思い出し、意味づけ直す働き。"]],"tip":"「忘れること＝回復」という前提を疑い、悲嘆を一つの段階や期間へ機械的に当てはめていないかを見る。弔いでは個人の感情と共同体の儀礼の関係に注目する。記憶が死者との関係を保つことと、現在の生活を作り直すことがどう両立しているかを追いたい。"},{"id":120,"area":"X","areaName":"宗教・死生・超越","title":"超越・救済・生の意味","question":"「生きる意味」は、どこかに用意された正解を見つけることなのだろうか。苦しみや死を前にしても、人は宗教、他者との関係、仕事、未来への責任などに意味を見いだすことがある。超越や救済は、生をどう捉え直す考えなのか。","body":"「生きる意味は何か」という問いに、誰にでも当てはまる一つの答えを出すことは難しい。仕事、家族、創作、信仰、未来への責任など、人が意味を感じる対象は異なる。しかも、楽しいことが多ければ自動的に意味のある人生になるとも限らない。困難な仕事や他者の世話のように、負担を伴っていても大切だと感じる営みがある。生の意味を考えるには、快楽や満足だけでなく、自分が何に価値を認め、何との関係の中で生きているかを見る必要がある。\n\n「意味」には少なくとも二つの方向がある。自分が何をしたいかを選び、その活動に意味を作り出すという考え方がある一方、自分を超える価値や他者からの呼びかけに応答する中で意味を見いだすという考え方もある。前者では主体的な選択が重く、後者では自分だけでは完結しない関係が重くなる。どちらの場合も、意味をどこかに隠された正解として発見するだけではなく、生き方との関係で具体化していく点が重要である。\n\n超越とは、単に超自然的な存在を信じることだけを意味しない。自分の欲求や利益だけを基準にせず、それを越える価値、他者、共同体、未来などとの関係から自分を捉え直すことを指す場合もある。たとえば、自分が生きている間には完成しない仕事を次の世代のために続けるとき、現在の自分だけを超えた時間との関係が生まれる。宗教的な超越と、倫理的・社会的な超越は同じではないが、自己を唯一の基準にしない点で重なることがある。\n\n救済も、苦痛や不幸がすべて消えることだけを指すとは限らない。変えられない喪失や死がある以上、現実の問題を完全に取り除くことができない場面もある。そのとき、苦しみを人生全体の中でどう位置づけるかが変わることで、同じ現実との関係が変化することがある。ただし、苦痛に意味を見いだす考えを、苦しんでいる人へ外から押しつけることには注意が必要である。意味づけは、苦痛を生み出す社会的な原因を放置する理由にはならない。\n\n生の意味は、個人の内面だけで作られるわけでもない。誰かに必要とされる、仕事が社会の中で役立つ、自分の行為が未来へつながると感じるには、他者や制度との関係が必要である。逆に、本人が価値を感じている活動でも、社会から繰り返し無意味だと扱われれば、その意味を保つことが難しくなる場合がある。個人が意味を選ぶ自由と、その意味を支えたり壊したりする社会的な条件を両方見る必要がある。\n\n評論で超越・救済・生の意味が論じられたら、抽象語のまま読み進めない。筆者が意味を個人の満足に置くのか、他者、共同体、未来、宗教的な世界観との関係に置くのかを具体化する。超越では「何を越えるのか」、救済では「何から、どのように救われるのか」を確かめる。また、苦しみに意味を与えることと、苦しみの原因を改善することを混同しない。生の意味を一つの答えとしてではなく、価値と関係の組み方をめぐる問いとして読むことが重要である。","keywords":[["超越","現在の自己や日常の範囲を越える存在・価値・目的との関係を志向すること。"],["救済","苦しみや罪、迷いなどから解放され、生の意味を新しく捉え直すこと。"],["生の意味","自分の人生が理解可能で、目的や価値をもち、重要だと感じられることに関わる問い。"],["価値","何を大切で望ましいものとみなすかという基準。"],["世界観","世界や人間の位置、生と死などをどのように理解するかという基本的な見方。"]],"tip":"「意味」「超越」「救済」を抽象語のまま流さない。意味を個人の満足に置くのか、他者・共同体・未来・宗教的価値との関係に置くのかを具体化する。超越では何を越えるのか、救済では何からどう救われるのかを確認し、苦しみの意味づけと原因の改善を混同しない。"}]};
const PALETTE={A:'#3D6EC9',B:'#3C86C7',C:'#2F9AAE',D:'#2E9C88',E:'#3E8D66',F:'#65954F',G:'#8D9442',H:'#A18A3B',I:'#6A61C8',J:'#8158BA',K:'#9B569E',L:'#B45E86',M:'#C4555A',N:'#CC684C',O:'#D27C42',P:'#C67A62',Q:'#D58A35',R:'#BE9A34',S:'#9F8C48',T:'#8D7B5C',U:'#3C8D91',V:'#3F789E',W:'#536CA8',X:'#80639B'};
const articleMap=new Map(DATA.articles.map(a=>[a.id,a])),classMap=new Map(DATA.classification.map(x=>[x.id,x]));
const areas=[...new Map(DATA.classification.map(x=>[x.area,x.areaName])).entries()].map(([area,name])=>({area,name}));
const root=document.getElementById('viewRoot'),sideNav=document.getElementById('sideNav'),indexOverlay=document.getElementById('indexOverlay'),overlayIndex=document.getElementById('overlayIndex'),fontMenu=document.getElementById('fontMenu'),topbar=document.getElementById('topbar'),brandCurrent=document.getElementById('brandCurrent');
let pendingDir='depth',pendingScrollMode='top',initialized=false,articleObserver=null,lastScroll=0,positionSaveRAF=0,keywordHideTimer=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}function sessionGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}function sessionSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function areaTopics(a){return DATA.classification.filter(x=>x.area===a)}function currentArticle(){const m=location.hash.match(/^#article=(\d+)$/);return m?Math.max(1,Math.min(120,+m[1])):null}function currentArea(){const m=location.hash.match(/^#area=([A-X])$/);return m?m[1]:null}
function setTheme(area){document.documentElement.style.setProperty('--theme',PALETTE[area]||'#3D6EC9');document.body.style.setProperty('--page-progress','0');document.body.style.setProperty('--read-progress','0')}
function positionKey(id){return `hyouron:kiso:pos:${id}`}
function saveReadingPosition(){
 const id=currentArticle();if(!id||!document.body.classList.contains('article-mode'))return;
 const paras=[...root.querySelectorAll('.body-text p[data-read-p]')];
 let anchor=null;
 const guide=(topbar?.offsetHeight||56)+54;
 for(const p of paras){if(p.getBoundingClientRect().top<=guide)anchor=p;else break}
 const payload=anchor
   ?{p:+anchor.dataset.readP,delta:Math.round(scrollY-(scrollY+anchor.getBoundingClientRect().top))}
   :{p:-1,delta:Math.round(scrollY)};
 sessionSet(positionKey(id),JSON.stringify(payload));
}
function restoreReadingPosition(id){
 const raw=sessionGet(positionKey(id));if(!raw)return false;
 try{
   const pos=JSON.parse(raw);
   if(pos.p>=0){
     const el=root.querySelector(`.body-text p[data-read-p="${pos.p}"]`);
     if(el){
       const y=scrollY+el.getBoundingClientRect().top+(pos.delta||0);
       scrollTo({top:Math.max(0,y),behavior:'auto'});return true;
     }
   }
   if(Number.isFinite(pos.delta)){scrollTo({top:Math.max(0,pos.delta),behavior:'auto'});return true}
 }catch(e){}
 return false;
}
function navigate(hash,dir='depth'){
 saveReadingPosition();pendingDir=dir;
 if(location.hash===hash){renderRoute();return}
 location.hash=hash
}
function goHome(){pendingScrollMode='top';navigate('#home','depth')}
function goIndex(){if(innerWidth<=1180){closeIndex();goHome()}else openIndex()}
function goArea(a){pendingScrollMode='top';navigate('#area='+a,'depth')}
function goArticle(id,mode='direct'){
 const cur=currentArticle();
 pendingDir=cur?(id>cur?'forward':id<cur?'back':'depth'):'forward';
 pendingScrollMode=mode==='direct'?'restore':'top';
 navigate('#article='+id,pendingDir)
}
function mix(hex,target,amount){const p=x=>parseInt(x,16),h=hex.replace('#',''),t=target.replace('#','');const a=[p(h.slice(0,2)),p(h.slice(2,4)),p(h.slice(4,6))],b=[p(t.slice(0,2)),p(t.slice(2,4)),p(t.slice(4,6))];return '#'+a.map((v,i)=>Math.round(v*(1-amount)+b[i]*amount).toString(16).padStart(2,'0')).join('')}
function kwColors(theme,n){const targets=['#FFFFFF','#273D66','#D95D6B','#2B9678','#E29B35','#7A5BC1'];return Array.from({length:n},(_,i)=>i===0?theme:mix(theme,targets[(i%5)+1],.25))}
function renderTextWithKeys(text,keywordPairs,colors,seenTerms){

function setupSpectrumMotion(){
