<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>評論　基礎知識</title>
<style>
@property --theme{syntax:'<color>';inherits:true;initial-value:#3d6ec9}
:root{
 --paper:#f7f7f5;--paper2:#fcfcfa;--ink:#17191b;--muted:#787c81;--hair:#dedfdd;
 --theme:#3d6ec9;--theme-soft:color-mix(in srgb,var(--theme) 9%,white);--theme-faint:color-mix(in srgb,var(--theme) 4%,white);
 --header:64px;--side:286px;--reader:18px;--leading:2;
 --ease:cubic-bezier(.22,.8,.25,1);--fast:160ms;--mid:260ms;--slow:420ms;
 --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
 --serif:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:--theme var(--slow) var(--ease)}
button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--theme);outline-offset:3px}
.hidden{display:none!important}
::selection{background:color-mix(in srgb,var(--theme) 22%,white)}

/* HUD */
.topbar{position:sticky;top:0;z-index:60;height:var(--header);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(18px) saturate(130%);border-bottom:1px solid var(--hair);transition:height var(--mid) var(--ease),background var(--mid) var(--ease)}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--theme);transform-origin:left;transform:scaleX(var(--page-progress,0));transition:background-color var(--slow) var(--ease)}
.topbar-inner{height:100%;max-width:1600px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:14px}
.icon,.ghost{border:0;background:transparent;cursor:pointer;border-radius:10px;height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;transition:background var(--fast),transform var(--fast)}
.icon:hover,.ghost:hover{background:color-mix(in srgb,var(--theme) 8%,white);transform:translateY(-1px)}
.menu-btn{display:none;font-size:20px}
.brand{border:0;background:transparent;cursor:pointer;text-align:left;padding:3px 5px 3px 0;white-space:nowrap;min-width:145px}
.brand-main{font-size:17px;font-weight:800;letter-spacing:.07em}.brand-sub{font-size:10px;color:var(--muted);margin-left:9px;letter-spacing:.04em}
.brand-current{display:none;font-family:var(--serif);font-size:13px;font-weight:700;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchbox{flex:1;max-width:650px;margin-left:18px;position:relative}.searchbox input{width:100%;height:40px;border:1px solid var(--hair);border-radius:11px;background:rgba(255,255,255,.78);padding:0 42px 0 14px;outline:none;transition:border-color var(--fast),box-shadow var(--fast),background var(--fast)}
.searchbox input:focus{border-color:color-mix(in srgb,var(--theme) 42%,var(--hair));box-shadow:0 0 0 4px color-mix(in srgb,var(--theme) 7%,transparent);background:#fff}.search-mark{position:absolute;right:14px;top:10px;color:var(--muted);pointer-events:none}
.top-actions{margin-left:auto;display:flex;gap:3px}.font-btn{font-weight:760;letter-spacing:-.02em}.mobile-search{display:none}
.font-menu{position:fixed;z-index:90;top:56px;right:22px;display:none;gap:4px;padding:7px;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border:1px solid var(--hair);border-radius:12px;box-shadow:0 16px 40px rgba(25,30,35,.12)}
.font-menu.open{display:flex}.font-choice{border:0;background:transparent;border-radius:8px;padding:8px 11px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;transition:.15s}.font-choice:hover{background:#f0f1ef;color:var(--ink)}.font-choice.active{background:var(--theme);color:#fff}

/* shell */
.shell{max-width:1600px;margin:auto;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.sidebar{position:sticky;top:var(--header);height:calc(100vh - var(--header));overflow:auto;border-right:1px solid var(--hair);padding:20px 13px 36px;scrollbar-width:thin;background:color-mix(in srgb,var(--paper) 97%,white)}
.side-home{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;padding:10px 12px;margin-bottom:10px;border-radius:8px;color:#50545a;font-size:12px;font-weight:760;letter-spacing:.035em}.side-home:hover{background:#eceeeb}
.area-block{position:relative;margin:0}.area-block:before{content:"";position:absolute;left:1px;top:9px;width:2px;height:22px;border-radius:3px;background:var(--area);transition:width var(--fast),height var(--mid) var(--ease),opacity var(--fast);opacity:.78}.area-block.open:before{width:4px;height:31px;opacity:1}
.area-toggle{width:100%;border:0;background:transparent;cursor:pointer;display:grid;grid-template-columns:29px 1fr 17px;gap:7px;text-align:left;align-items:center;padding:8px 8px 8px 12px;border-radius:8px;color:#565b60;transition:background var(--fast),color var(--fast)}.area-toggle:hover{background:color-mix(in srgb,var(--area) 7%,white);color:var(--ink)}.area-toggle.active{color:var(--area);font-weight:800}
.area-letter{font-size:11px;font-weight:850;color:var(--area)}.area-name{font-size:12.2px;line-height:1.36}.chev{font-size:12px;color:#999;transition:transform var(--mid) var(--ease)}.area-block.open .chev{transform:rotate(90deg)}
.topic-list{max-height:none;overflow:visible;opacity:1;padding:3px 0 8px 27px}
.topic-btn{position:relative;width:100%;border:0;background:transparent;cursor:pointer;text-align:left;padding:6px 8px;border-radius:6px;display:grid;grid-template-columns:26px 1fr;gap:4px;color:#6d7175;font-size:11.8px;line-height:1.42;transition:color var(--fast),transform var(--fast)}.topic-btn:hover{color:var(--area);transform:translateX(2px)}.topic-btn.active{color:var(--area);font-weight:800}.topic-btn.active:before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:2px;border-radius:3px;background:var(--area)}.topic-num{color:#999;font-variant-numeric:tabular-nums}
.stage{min-width:0;padding:0 48px 100px;overflow:hidden}.view{max-width:1080px;margin:auto}

/* view transitions */
#viewRoot{min-height:70vh}.route-enter-forward{animation:enterForward var(--mid) var(--ease) both}.route-enter-back{animation:enterBack var(--mid) var(--ease) both}.route-enter-depth{animation:enterDepth var(--mid) var(--ease) both}.route-exit-forward{animation:exitForward 130ms ease both}.route-exit-back{animation:exitBack 130ms ease both}.route-exit-depth{animation:exitDepth 130ms ease both}
@keyframes enterForward{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}@keyframes enterBack{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}@keyframes enterDepth{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
@keyframes exitForward{to{opacity:0;transform:translateX(-9px)}}@keyframes exitBack{to{opacity:0;transform:translateX(9px)}}@keyframes exitDepth{to{opacity:0;transform:translateY(-4px)}}

/* home: chromatic editorial index */
.home-view{padding-top:58px}.home-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:end;margin-bottom:48px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.15em;color:#73777c;margin-bottom:12px}.home-hero h1{font-family:var(--serif);font-size:clamp(44px,6vw,72px);line-height:1;margin:0 0 16px;letter-spacing:.03em}.home-hero p{margin:0;max-width:650px;color:#656a6f;line-height:1.8;font-size:14px}.spectrum{display:flex;gap:4px;align-items:flex-end;padding-bottom:3px}.spectrum i{display:block;width:7px;height:30px;border-radius:5px;background:var(--c);transform-origin:bottom;transition:height var(--mid) var(--ease)}.spectrum:hover i:nth-child(3n){height:44px}.spectrum:hover i:nth-child(4n){height:20px}
.index-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair)}.index-row{--area:#777;position:relative;border:0;border-bottom:1px solid var(--hair);background:transparent;cursor:pointer;display:grid;grid-template-columns:54px 1fr 62px 18px;gap:10px;align-items:center;text-align:left;padding:16px 10px 16px 5px;min-height:76px;transition:background var(--fast),padding var(--mid) var(--ease)}.index-row:nth-child(odd){border-right:1px solid var(--hair)}.index-row:before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:3px;border-radius:4px;background:var(--area);transition:width var(--mid) var(--ease),top var(--mid),bottom var(--mid)}.index-row:hover{background:color-mix(in srgb,var(--area) 7%,white);padding-left:12px}.index-row:hover:before{width:7px;top:10px;bottom:10px}.index-letter{font-size:17px;font-weight:900;color:var(--area);padding-left:12px}.index-title{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.4}.index-range{font-size:10px;color:#8d9195;font-variant-numeric:tabular-nums;text-align:right}.index-arrow{opacity:0;transform:translateX(-6px);color:var(--area);transition:opacity var(--fast),transform var(--fast)}.index-row:hover .index-arrow{opacity:1;transform:none}

/* area page */
.area-view{padding-top:48px;max-width:910px}.breadcrumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:28px}.crumb{border:0;background:transparent;padding:0;cursor:pointer;color:inherit}.crumb:hover{color:var(--theme)}
.area-hero{position:relative;overflow:hidden;padding:20px 0 36px;margin-bottom:10px}.area-ghost{position:absolute;right:2%;top:-55px;font-size:190px;line-height:1;font-weight:900;color:color-mix(in srgb,var(--theme) 9%,transparent);pointer-events:none}.area-code{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--theme);margin-bottom:10px}.area-hero h1{font-family:var(--serif);font-size:38px;line-height:1.3;margin:0;position:relative}.area-list{border-top:1px solid var(--hair)}.area-topic{--area:var(--theme);position:relative;width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;cursor:pointer;display:grid;grid-template-columns:76px 1fr 24px;align-items:center;text-align:left;gap:10px;padding:20px 5px;transition:background var(--fast),padding var(--mid) var(--ease)}.area-topic:hover{background:color-mix(in srgb,var(--area) 6%,white);padding-left:13px;padding-right:11px}.area-topic-num{font-size:11px;font-weight:800;color:var(--area)}.area-topic-title{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.42}.area-topic-arrow{color:var(--area);opacity:.4;transform:translateX(-4px);transition:.16s}.area-topic:hover .area-topic-arrow{opacity:1;transform:none}

/* article */
.article-view{position:relative;max-width:920px;padding-top:34px}.article-breadcrumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:22px}.article-hero{position:relative;min-height:210px;padding:24px 0 40px;overflow:hidden}.article-ghost{position:absolute;right:-5px;top:-42px;font-size:230px;line-height:1;font-weight:950;color:color-mix(in srgb,var(--theme) 9%,transparent);letter-spacing:-.08em;pointer-events:none;user-select:none;transition:color var(--slow)}.article-meta{font-size:11px;letter-spacing:.14em;font-weight:900;color:var(--theme);margin-bottom:17px;position:relative}.article-title{position:relative;font-family:var(--serif);font-size:clamp(32px,4.2vw,46px);line-height:1.35;margin:0;max-width:720px;font-weight:700;letter-spacing:.015em}
.question{position:relative;margin:0 -28px 52px;padding:38px 48px 40px;overflow:hidden;background:linear-gradient(122deg,color-mix(in srgb,var(--theme) 12%,white),color-mix(in srgb,var(--theme) 4%,white) 66%,rgba(255,255,255,.35));border-top:1px solid color-mix(in srgb,var(--theme) 22%,var(--hair));border-bottom:1px solid color-mix(in srgb,var(--theme) 22%,var(--hair))}.question-q{position:absolute;right:32px;top:-41px;font-family:var(--sans);font-weight:950;font-size:180px;line-height:1;color:color-mix(in srgb,var(--theme) 12%,transparent);user-select:none}.section-kicker{position:relative;font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--theme);margin-bottom:15px}.question-text{position:relative;font-family:var(--serif);font-size:calc(var(--reader) + 2px);line-height:1.92;font-weight:650;letter-spacing:.012em;max-width:760px}
.prose-wrap{position:relative;max-width:740px;margin:0 auto}.body-label{font-size:9px;letter-spacing:.19em;font-weight:900;color:#9a9da0;margin-bottom:19px}.body-text{font-family:var(--serif);font-size:var(--reader);line-height:var(--leading);letter-spacing:.012em}.body-text p{margin:0 0 1.45em;text-align:justify;text-justify:inter-ideograph;transition:opacity 440ms var(--ease),transform 440ms var(--ease)}.motion-ready .body-text p.reveal{opacity:.72;transform:translateY(5px)}.motion-ready .body-text p.reveal.seen{opacity:1;transform:none}.key-ref{border-radius:3px;transition:background-color 650ms var(--ease),color 400ms}.key-ref.flash{background:color-mix(in srgb,var(--theme) 23%,white);color:color-mix(in srgb,var(--theme) 70%,#000)}

.keywords{max-width:820px;margin:68px auto 0;padding-top:25px;border-top:1px solid var(--hair)}.keywords-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}.keywords-title{font-family:var(--sans);font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--theme)}.keywords-note{font-size:10px;color:#969a9d}.keyword-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 34px}.keyword-item{--kw:var(--theme);position:relative;border:0;background:transparent;cursor:pointer;text-align:left;padding:15px 4px 17px 0;min-height:128px;border-top:3px solid var(--kw);transition:transform var(--mid) var(--ease),background var(--fast),padding var(--mid)}.keyword-item:hover{transform:translateY(-3px);background:color-mix(in srgb,var(--kw) 6%,white);padding-left:10px;padding-right:9px}.kw-index{font-size:9px;font-weight:900;color:var(--kw);letter-spacing:.12em;margin-bottom:9px}.kw-term{display:block;font-family:var(--serif);font-size:21px;font-weight:750;color:var(--kw);line-height:1.35;margin-bottom:8px}.kw-desc{display:block;font-family:var(--serif);font-size:calc(var(--reader) - 3px);line-height:1.8;color:#4e5357}.keyword-item.active{background:color-mix(in srgb,var(--kw) 8%,white);transform:translateY(-2px)}

.article-footer{max-width:840px;margin:70px auto 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);display:grid;grid-template-columns:1fr 170px 1fr}.foot-nav{border:0;background:transparent;cursor:pointer;min-height:118px;padding:22px 18px;text-align:left;transition:background var(--fast),padding var(--mid) var(--ease);position:relative}.foot-nav+ .foot-nav{border-left:1px solid var(--hair)}.foot-nav:hover{background:color-mix(in srgb,var(--theme) 6%,white)}.foot-nav.prev:hover{padding-left:10px}.foot-nav.next{text-align:right}.foot-nav.next:hover{padding-right:10px}.foot-nav.index{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.foot-label{display:block;font-size:9px;letter-spacing:.13em;font-weight:900;color:var(--theme);margin-bottom:8px}.foot-title{display:block;font-family:var(--serif);font-size:13px;line-height:1.45;color:#51565a}.foot-index-mark{font-size:22px;color:var(--theme);line-height:1;margin-bottom:7px}.foot-nav:disabled{opacity:.22;cursor:default}.foot-nav:disabled:hover{background:transparent;padding-left:18px;padding-right:18px}

/* reading rail */
.reading-rail{position:fixed;z-index:44;right:0;top:var(--header);bottom:0;width:2px;background:color-mix(in srgb,var(--theme) 10%,transparent);opacity:0;transition:opacity var(--mid)}body.article-mode .reading-rail{opacity:1}.reading-rail span{display:block;width:100%;height:calc(var(--read-progress,0)*100%);background:var(--theme);transition:height 70ms linear,background var(--slow)}

/* overlay index */
.index-overlay{position:fixed;z-index:100;inset:0;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(20px) saturate(125%);opacity:0;pointer-events:none;transform:scale(1.01);transition:opacity var(--mid) var(--ease),transform var(--mid) var(--ease);overflow:auto}.index-overlay.open{opacity:1;pointer-events:auto;transform:none}.index-panel{max-width:980px;margin:auto;padding:23px 26px 70px}.overlay-head{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.overlay-title{font-weight:850;letter-spacing:.055em}.overlay-close{border:0;background:transparent;cursor:pointer;font-size:25px;border-radius:9px;width:40px;height:40px}.overlay-close:hover{background:#eceeeb}.overlay-area{--area:#777;border-top:1px solid var(--hair)}.overlay-area-head{width:100%;border:0;background:transparent;cursor:pointer;display:grid;grid-template-columns:42px 1fr 20px;gap:10px;text-align:left;align-items:center;padding:15px 6px}.overlay-area-head:hover{background:color-mix(in srgb,var(--area) 6%,white)}.overlay-letter{font-size:15px;font-weight:900;color:var(--area)}.overlay-name{font-family:var(--serif);font-size:17px;font-weight:700}.overlay-area .chev{justify-self:end}.overlay-area.open .chev{transform:rotate(90deg)}.overlay-topics{max-height:0;overflow:hidden;opacity:0;padding-left:43px;transition:max-height var(--mid) var(--ease),opacity var(--fast),padding var(--mid)}.overlay-area.open .overlay-topics{max-height:300px;opacity:1;padding-bottom:13px}.overlay-topic{width:100%;border:0;background:transparent;cursor:pointer;display:grid;grid-template-columns:42px 1fr;gap:8px;text-align:left;padding:8px 5px;border-radius:7px;color:#666}.overlay-topic:hover{background:color-mix(in srgb,var(--area) 7%,white);color:var(--area)}.overlay-topic.active{font-weight:800;color:var(--area)}

/* search */
.search-overlay{position:fixed;z-index:110;inset:0;background:rgba(247,247,245,.97);backdrop-filter:blur(18px);display:none;overflow:auto}.search-overlay.open{display:block}.search-panel{max-width:840px;margin:auto;padding:24px 24px 80px}.search-top{display:flex;gap:11px;align-items:center;height:52px;margin-bottom:24px}.search-top input{flex:1;border:0;border-bottom:1px solid #bbb;background:transparent;height:48px;font-size:18px;outline:none}.search-close{border:0;background:transparent;cursor:pointer;font-size:25px;width:42px;height:42px;border-radius:9px}.search-close:hover{background:#eceeeb}.search-count{font-size:11px;color:var(--muted);margin-bottom:10px}.search-results{border-top:1px solid var(--hair)}.search-result{--area:#777;width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;cursor:pointer;display:grid;grid-template-columns:60px 1fr 20px;gap:10px;text-align:left;padding:15px 6px;align-items:center;transition:background var(--fast),padding var(--mid)}.search-result:hover{background:color-mix(in srgb,var(--area) 6%,white);padding-left:13px}.result-id{font-size:10px;font-weight:800;color:var(--area)}.result-title{display:block;font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:3px}.result-area{font-size:10px;color:#8b8f93}.result-arrow{color:var(--area)}.empty{padding:34px 0;color:var(--muted);font-size:13px}

/* mobile bottom */
.mobile-nav{display:none;position:fixed;z-index:55;left:0;right:0;bottom:0;grid-template-columns:1fr 1fr 1fr;background:rgba(250,250,248,.87);backdrop-filter:blur(18px) saturate(140%);border-top:1px solid color-mix(in srgb,var(--theme) 18%,var(--hair));padding:5px max(9px,env(safe-area-inset-left)) calc(5px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-right));transition:transform var(--mid) var(--ease),opacity var(--mid) var(--ease),background var(--slow)}.mobile-nav.at-footer{transform:translateY(115%);opacity:0}.mobile-nav button{border:0;background:transparent;min-height:45px;border-radius:9px;cursor:pointer;font-size:10px;font-weight:800;letter-spacing:.03em;color:#63686c;transition:background var(--fast),color var(--fast),transform var(--fast)}.mobile-nav button:hover{background:color-mix(in srgb,var(--theme) 7%,white);color:var(--theme)}.mobile-nav button:nth-child(2){color:var(--theme)}.mobile-nav button:disabled{opacity:.25}.mobile-nav.compact{transform:translateY(4px)}

:root{

.index-row:before{left:0;top:0;right:0;bottom:auto;width:auto;height:4px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,var(--area),color-mix(in srgb,var(--area) 25%,white))}

.keyword-item:hover{transform:translateY(-3px);padding:16px 17px 15px;background:linear-gradient(145deg,color-mix(in srgb,var(--kw) 10%,white),#fff 62%);box-shadow:0 11px 26px color-mix(in srgb,var(--kw) 8%,transparent)}

.keyword-item:hover .kw-jump{opacity:1;transform:translateY(-1px)}

.article-footer{border:1px solid var(--hair);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.58);box-shadow:inset 0 1px 0 #fff}

/* App-name / HUD cleanup */
.home-title-line{display:block}
.home-stats{display:none!important}

.brand-main{white-space:nowrap}

/* ===== Final interaction & geometry polish ===== */

/* Header: searchless, deliberate three-part balance */
.topbar-inner{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:16px;
  max-width:1600px;
}
.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:18px;
  height:42px;
}
.brand-main{flex:0 0 auto}
.brand-current{
  display:block;
  min-width:0;
  max-width:420px;
  padding-left:18px;
  border-left:1px solid color-mix(in srgb,var(--theme) 18%,var(--hair));
  color:#777c80;
  transition:color .35s var(--ease),border-color .35s var(--ease),opacity .2s var(--ease);
}
.top-actions{margin-left:0;justify-self:end}
.font-btn{
  width:42px;
  min-width:42px;
  height:42px;
  border:1px solid color-mix(in srgb,var(--theme) 13%,var(--hair));
  background:rgba(255,255,255,.58);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.font-btn:hover{
  border-color:color-mix(in srgb,var(--theme) 32%,var(--hair));
  background:color-mix(in srgb,var(--theme) 7%,white);
}

/* Shared press feel */
button{ -webkit-tap-highlight-color:transparent }
.index-row:active,.area-topic:active,.keyword-item:active,.foot-nav:active,
.overlay-area-head:active,.overlay-topic:active,.topic-btn:active,.area-toggle:active,
.mobile-nav button:active,.font-choice:active{
  transform:scale(.988);
}

/* Home: rigid editorial grid, equal dimensions */
.index-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:146px;
  align-items:stretch;
  gap:12px;
}
.index-row{
  width:100%;
  min-height:0;
  height:100%;
  padding:16px 17px 15px;
  display:grid;
  grid-template-rows:30px minmax(0,1fr) 20px;
  align-items:start;
  box-sizing:border-box;
  isolation:isolate;
}
.index-row:hover{padding:16px 17px 15px}
.index-title{
  display:flex;
  align-items:center;
  margin:0;
  min-height:0;
  line-height:1.46;
}
.index-top,.index-bottom{width:100%;height:100%}
.index-row::after{
  transition:transform .42s var(--ease),opacity .42s var(--ease);
}
.index-row:hover::after{transform:scale(1.38) translate(-4px,-4px)}
.index-row .index-arrow{transition:opacity .22s var(--ease),transform .3s var(--ease)}
.index-row:hover .index-arrow{transform:translateX(4px)}

/* Area page: all five rows use the same geometry */
.area-list{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  border:0;
}
.area-topic{
  min-height:76px;
  height:76px;
  padding:0 16px;
  grid-template-columns:54px minmax(0,1fr) 24px;
  border:1px solid var(--hair);
  border-radius:12px;
  background:rgba(255,255,255,.68);
  box-sizing:border-box;
}
.area-topic:hover{
  padding:0 12px 0 20px;
  transform:translateY(-2px);
  box-shadow:0 9px 22px color-mix(in srgb,var(--area) 8%,transparent);
}
.area-topic-title{
  display:flex;
  align-items:center;
  min-height:100%;
}

/* Sidebar / overlay rows align to fixed touch targets */
.area-toggle{min-height:42px}
.topic-btn{
  min-height:36px;
  align-items:center;
}
.overlay-area-head{
  min-height:58px;
  padding-top:0;
  padding-bottom:0;
}
.overlay-topic{
  min-height:44px;
  align-items:center;
}

/* Overlay enters as one coherent layer */
.index-overlay{
  transform:none;
  transition:opacity .24s var(--ease),background-color .35s var(--ease);
}
.index-panel{
  opacity:0;
  transform:translateY(14px) scale(.992);
  transition:opacity .26s var(--ease),transform .34s var(--ease);
}
.index-overlay.open .index-panel{
  opacity:1;
  transform:none;
}
.overlay-area-head .overlay-letter{
  width:30px;
  height:30px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  transition:background .24s var(--ease),color .24s var(--ease),transform .24s var(--ease);
}
.overlay-area.open .overlay-letter{
  background:var(--area);
  color:white;
  transform:scale(1.04);
}
.overlay-topics{
  transform:translateY(-5px);
  transition:max-height .32s var(--ease),opacity .2s var(--ease),
             padding .32s var(--ease),transform .32s var(--ease);
}
.overlay-area.open .overlay-topics{transform:none}

/* Article top rhythm */
.article-hero{
  padding-bottom:32px;
  margin-bottom:2px;
}
.article-accent i{
  transform-origin:left center;
  animation:accentIn .48s var(--ease) both;
}
.article-accent i:nth-child(2){animation-delay:35ms}
.article-accent i:nth-child(3){animation-delay:70ms}
.article-accent i:nth-child(4){animation-delay:105ms}
.article-accent i:nth-child(5){animation-delay:140ms}
@keyframes accentIn{
  from{opacity:0;transform:scaleX(.25)}
  to{opacity:.9;transform:scaleX(1)}
}

/* Question: steady geometry with graceful entrance */
.question{
  overflow:hidden;
  transition:border-color .35s var(--ease),box-shadow .35s var(--ease),background .35s var(--ease);
  animation:questionIn .42s var(--ease) .06s both;
}
@keyframes questionIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
.question-rule{transform-origin:left;animation:ruleIn .5s var(--ease) .14s both}
@keyframes ruleIn{from{transform:scaleX(.12);opacity:.25}to{transform:scaleX(1);opacity:1}}

/* Body reveal made subtler and cleaner */
.motion-ready .body-text p.reveal{
  opacity:.84;
  transform:translateY(4px);
  filter:blur(.2px);
}
.motion-ready .body-text p.reveal.seen{
  opacity:1;
  transform:none;
  filter:none;
}

/* Inline terms: precise interactive signal */
.key-ref{
  position:relative;
  transition:background-color .2s var(--ease),color .2s var(--ease),
             box-shadow .2s var(--ease),text-decoration-color .2s var(--ease);
}
.key-ref:hover,.key-ref:focus,.key-ref.tip-open{
  transform:none;
}

/* Keyword cards: same width and same height across the grid */
.keyword-grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:1fr;
  align-items:stretch;
  gap:12px;
}
.keyword-item{
  width:100%;
  min-height:158px;
  height:100%;
  display:grid;
  grid-template-columns:34px minmax(0,1fr);
  grid-template-rows:auto 1fr auto;
  column-gap:10px;
  align-items:start;
  box-sizing:border-box;
}
.kw-index{grid-column:1;grid-row:1;align-self:center}
.kw-term{grid-column:2;grid-row:1}
.kw-desc{grid-column:1 / -1;grid-row:2;margin-top:10px}
.kw-jump{grid-column:1 / -1;grid-row:3;align-self:end}
.keyword-item::after{
  content:"";
  position:absolute;
  inset:auto 12px 0 12px;
  height:2px;
  border-radius:2px;
  background:var(--kw);
  transform:scaleX(0);
  transform-origin:left;
  opacity:.55;
  transition:transform .32s var(--ease);
}
.keyword-item:hover::after,.keyword-item.active::after{transform:scaleX(1)}
.keyword-item:hover{
  transform:translateY(-3px);
}

/* Popover motion */
.keyword-popover{
  transform:translateY(8px) scale(.98);
  transform-origin:center bottom;
}
.keyword-popover.open{
  transform:none;
}

/* Footer: true equal thirds, equal height */
.article-footer{
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:stretch;
}
.foot-nav{
  min-width:0;
  width:100%;
  height:116px;
  min-height:116px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-sizing:border-box;
}
.foot-nav.index{
  align-items:center;
  text-align:center;
}
.foot-title{
  width:100%;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  line-height:1.42;
}
.foot-nav::after{
  content:"";
  position:absolute;
  left:16px;right:16px;bottom:10px;
  height:2px;border-radius:99px;
  background:var(--theme);
  opacity:0;
  transform:scaleX(.15);
  transition:opacity .22s var(--ease),transform .3s var(--ease);
}
.foot-nav.prev::after{transform-origin:left}
.foot-nav.next::after{transform-origin:right}
.foot-nav.index::after{transform-origin:center}
.foot-nav:hover::after{opacity:.55;transform:scaleX(1)}

/* Route motion: more physical, still restrained */
#viewRoot{
  transform-origin:50% 18%;
  will-change:transform,opacity,filter;
}
.route-enter-forward{animation:enterForwardPolish .34s var(--ease) both}
.route-enter-back{animation:enterBackPolish .34s var(--ease) both}
.route-enter-depth{animation:enterDepthPolish .38s var(--ease) both}
.route-exit-forward{animation:exitForwardPolish .13s ease-out both}
.route-exit-back{animation:exitBackPolish .13s ease-out both}
.route-exit-depth{animation:exitDepthPolish .13s ease-out both}
@keyframes enterForwardPolish{
  from{opacity:0;transform:translateX(18px) scale(.997);filter:blur(1px)}
  to{opacity:1;transform:none;filter:none}
}
@keyframes enterBackPolish{
  from{opacity:0;transform:translateX(-18px) scale(.997);filter:blur(1px)}
  to{opacity:1;transform:none;filter:none}
}
@keyframes enterDepthPolish{
  from{opacity:0;transform:translateY(10px) scale(.992);filter:blur(1px)}
  to{opacity:1;transform:none;filter:none}
}
@keyframes exitForwardPolish{to{opacity:0;transform:translateX(-8px) scale(.998)}}
@keyframes exitBackPolish{to{opacity:0;transform:translateX(8px) scale(.998)}}
@keyframes exitDepthPolish{to{opacity:0;transform:translateY(-5px) scale(.997)}}

/* Mobile bottom bar: equal thirds, more tactile */
.mobile-nav{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:4px;
}
.mobile-nav button{
  width:100%;
  min-width:0;
  height:46px;
}
.mobile-nav button:nth-child(2){
  border-left:1px solid color-mix(in srgb,var(--theme) 12%,var(--hair));
  border-right:1px solid color-mix(in srgb,var(--theme) 12%,var(--hair));
}

/* Tablet */
@media(max-width:1180px){
  .index-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:140px}
  .brand-current{max-width:280px}
}

/* Mobile */
@media(max-width:760px){
  .topbar-inner{
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:7px;
    padding-left:10px;
    padding-right:10px;
  }
  .menu-btn{grid-column:1}
  .brand{grid-column:2;height:38px;min-width:0}
  .top-actions{grid-column:3}
  .brand-current{display:none}
  .brand-main{
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:14.5px;
  }
  .font-btn{width:36px;min-width:36px;height:36px}

  .topbar.compact .brand-main{display:none}
  .topbar.compact .brand-current{
    display:block;
    max-width:100%;
    padding-left:0;
    border-left:0;
    font-size:12px;
    color:#555a5e;
  }

  .index-grid{grid-template-columns:1fr;grid-auto-rows:112px;gap:8px}
  .index-row{
    grid-template-rows:26px minmax(0,1fr) 17px;
    padding:12px 14px;
  }
  .index-row:hover{padding:12px 14px}
  .index-title{font-size:16px}

  .area-topic{
    height:68px;
    min-height:68px;
    padding:0 12px;
    grid-template-columns:46px minmax(0,1fr) 18px;
  }
  .area-topic:hover{padding:0 9px 0 15px}

  .keyword-grid{grid-template-columns:1fr}
  .keyword-item{min-height:140px}

  .article-footer{grid-template-columns:repeat(3,minmax(0,1fr))}
  .foot-nav{
    height:96px;
    min-height:96px;
    padding:12px 9px;
  }
  .foot-title{font-size:10.5px}

  .index-panel{padding-left:14px;padding-right:14px}
  .overlay-area-head{min-height:54px}
  .overlay-topic{min-height:42px}
}

/* Motion accessibility */
@media(prefers-reduced-motion:reduce){
  .article-accent i,.question,.question-rule{animation:none!important}
  #viewRoot{will-change:auto}
}


.searchbox,.mobile-search,.search-overlay{display:none!important}

/* ===== One-tap index & refined selection ===== */
.direct-index{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.direct-section{
 --area:#667;position:relative;min-width:0;overflow:hidden;
 border:1px solid color-mix(in srgb,var(--area) 17%,var(--hair));border-radius:18px;
 background:linear-gradient(155deg,color-mix(in srgb,var(--area) 6%,white),rgba(255,255,255,.95) 42%,white);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.96),0 8px 24px rgba(20,25,30,.035);
 opacity:0;transform:translateY(7px);
 animation:directSectionIn .38s var(--ease) var(--delay) forwards;
 transition:border-color .28s var(--ease),box-shadow .34s var(--ease),transform .34s var(--ease)
}
.direct-section:before{content:"";position:absolute;z-index:2;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--area),color-mix(in srgb,var(--area) 34%,white),transparent 82%);opacity:.8}
.direct-section:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-70px;top:-66px;background:var(--area);opacity:.045;pointer-events:none;transition:transform .48s var(--ease),opacity .3s}
.direct-section:hover{border-color:color-mix(in srgb,var(--area) 28%,var(--hair));box-shadow:0 15px 38px color-mix(in srgb,var(--area) 8%,transparent);transform:translateY(-2px)}
.direct-section:hover:after{transform:scale(1.25);opacity:.075}
@keyframes directSectionIn{to{opacity:1;transform:none}}
.direct-head{height:60px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid color-mix(in srgb,var(--area) 10%,var(--hair))}
.direct-letter{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:var(--area);color:#fff;font-size:11px;font-weight:900;box-shadow:0 6px 15px color-mix(in srgb,var(--area) 20%,transparent)}
.direct-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif);font-size:16.5px;font-weight:760}
.direct-range{font-size:9px;letter-spacing:.08em;color:#979b9f;font-variant-numeric:tabular-nums}
.direct-topics{display:grid}
.direct-topic{position:relative;width:100%;min-height:51px;display:grid;grid-template-columns:38px minmax(0,1fr) 20px;gap:8px;align-items:center;border:0;border-top:1px solid color-mix(in srgb,var(--area) 7%,var(--hair));background:transparent;padding:8px 14px;text-align:left;cursor:pointer;color:var(--ink);transition:background .18s var(--ease),padding .22s var(--ease),color .18s}
.direct-topic:first-child{border-top:0}
.direct-topic:hover{background:color-mix(in srgb,var(--area) 7%,white);padding-left:18px}
.direct-topic:active{transform:scale(.993)}
.direct-num{font-size:9px;font-weight:800;color:color-mix(in srgb,var(--area) 77%,#777);font-variant-numeric:tabular-nums}
.direct-topic-title{min-width:0;font-family:var(--serif);font-size:13.5px;font-weight:650;line-height:1.38}
.direct-go{justify-self:end;color:var(--area);opacity:0;transform:translateX(-5px);transition:opacity .18s,transform .24s var(--ease)}
.direct-topic:hover .direct-go{opacity:.92;transform:none}
.direct-state{position:absolute;left:0;top:9px;bottom:9px;width:0;border-radius:0 4px 4px 0;background:var(--area);transition:width .2s var(--ease)}
.index-grid{display:none!important}

/* Direct full index: category headers are labels, not controls */
.overlay-index-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.overlay-area{--area:#667;position:relative;border:1px solid color-mix(in srgb,var(--area) 14%,var(--hair));border-radius:15px;overflow:hidden;background:rgba(255,255,255,.76);box-shadow:inset 0 1px 0 rgba(255,255,255,.88);transition:border-color .25s var(--ease),box-shadow .3s var(--ease)}
.overlay-area.current-area{border-color:color-mix(in srgb,var(--area) 30%,var(--hair));box-shadow:0 11px 28px color-mix(in srgb,var(--area) 7%,transparent)}
.overlay-area.current-area:before{content:"";position:absolute;z-index:2;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--area),color-mix(in srgb,var(--area) 35%,white),transparent)}
.overlay-area-head{min-height:54px;display:grid;grid-template-columns:31px minmax(0,1fr) auto;align-items:center;gap:9px;padding:0 13px;border:0;background:color-mix(in srgb,var(--area) 3%,white);cursor:default}
.overlay-letter{width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#fff;background:var(--area);font-size:10px;font-weight:900}
.overlay-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif);font-size:14.5px;font-weight:720}
.overlay-range{font-size:9px;color:#999;font-variant-numeric:tabular-nums}
.overlay-topics{max-height:none!important;overflow:visible!important;opacity:1!important;padding:0!important;transform:none!important}
.overlay-topic{position:relative;width:100%;min-height:43px;display:grid;grid-template-columns:34px minmax(0,1fr) 12px;gap:7px;align-items:center;padding:7px 12px;border:0;border-top:1px solid color-mix(in srgb,var(--area) 7%,var(--hair));border-radius:0;background:transparent;color:#51565a;text-align:left;cursor:pointer;transition:background .18s,color .18s,padding .22s var(--ease)}
.overlay-topic:hover{background:color-mix(in srgb,var(--area) 7%,white);color:var(--ink);padding-left:15px}
.overlay-topic-num{font-size:9px;color:color-mix(in srgb,var(--area) 72%,#888)}
.overlay-topic-title{font-family:var(--serif);font-size:12.7px;line-height:1.35}

.overlay-topic.active{color:var(--area);font-weight:760;background:color-mix(in srgb,var(--area) 7%,white)}
.overlay-topic.active:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--area)}
.overlay-topic.active .overlay-topic-state{opacity:1;transform:scale(1.12);box-shadow:0 0 0 5px color-mix(in srgb,var(--area) 10%,transparent)}

/* Sidebar: no category click required. Current category stays open; other categories open on hover. */
.area-toggle{cursor:default;grid-template-columns:27px minmax(0,1fr) auto}
.area-toggle .chev{display:none}
.area-mini-range{font-size:8px;color:#a0a3a6;font-variant-numeric:tabular-nums}

.topic-btn.active{color:var(--area);font-weight:760;background:color-mix(in srgb,var(--area) 7%,white);box-shadow:none!important}
.topic-btn.active:before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--area)}

.topic-btn:hover{background:color-mix(in srgb,var(--area) 5%,white);transform:translateX(2px)}

/* Current-location ornament: thin, calm, consistent */
.article-breadcrumb .crumb{position:relative;border-radius:5px}
.article-breadcrumb .crumb:after{content:"";position:absolute;left:5px;right:5px;bottom:1px;height:1px;background:var(--theme);transform:scaleX(0);transform-origin:left;opacity:.55;transition:transform .22s var(--ease)}
.article-breadcrumb .crumb:hover:after{transform:scaleX(1)}

/* ===== Reading flow / quick navigation polish ===== */

/* Universal article → index affordance.
   Desktop + tablet: floating pill. Mobile uses the fixed three-way bar. */
.quick-index{
  position:fixed;
  z-index:52;
  right:22px;
  bottom:22px;
  width:86px;
  height:44px;
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid color-mix(in srgb,var(--theme) 20%,var(--hair));
  border-radius:999px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  color:color-mix(in srgb,var(--theme) 78%,#3f4448);
  backdrop-filter:blur(16px) saturate(135%);
  -webkit-backdrop-filter:blur(16px) saturate(135%);
  box-shadow:0 9px 30px rgba(20,25,30,.10),inset 0 1px 0 rgba(255,255,255,.9);
  cursor:pointer;
  opacity:0;
  transform:translateY(8px) scale(.97);
  transition:
    opacity .22s var(--ease),
    transform .26s var(--ease),
    background .2s var(--ease),
    border-color .2s var(--ease),
    box-shadow .25s var(--ease);
}
.article-mode .quick-index{display:flex;opacity:1;transform:none}
.index-open .quick-index{opacity:0;pointer-events:none;transform:translateY(8px) scale(.96)}
.quick-index:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--theme) 38%,var(--hair));
  background:color-mix(in srgb,var(--theme) 7%,white);
  box-shadow:0 13px 32px color-mix(in srgb,var(--theme) 10%,transparent),inset 0 1px 0 white;
}
.quick-index:active{transform:translateY(0) scale(.985)}
.quick-index-icon{
  width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--theme);color:white;font-size:12px;font-weight:900;
  box-shadow:0 4px 12px color-mix(in srgb,var(--theme) 18%,transparent);
}
.quick-index-label{font-size:11px;font-weight:850;letter-spacing:.05em}

/* PC sidebar's own menu stays pinned and feels like a true home/index control. */
.side-home{
  min-height:40px;
  border-radius:10px;
  color:color-mix(in srgb,var(--theme) 72%,#4b5054);
  transition:background .18s var(--ease),transform .18s var(--ease),color .18s var(--ease);
}
.side-home::before{
  content:"≡";
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;margin-right:7px;
  border-radius:6px;background:color-mix(in srgb,var(--theme) 9%,white);
  color:var(--theme);font-size:11px;font-weight:900;
}
.side-home:hover{
  background:color-mix(in srgb,var(--theme) 7%,white);
  color:var(--theme);
  transform:translateX(1px);
}

/* Article opening: movement only at entry, then reading becomes completely still. */
.article-heading-row{
  opacity:0;
  transform:translateY(8px);
}
.article-accent{
  opacity:0;
  transform:translateY(3px);
}
.question{
  opacity:0;
  transform:translateY(7px);
}
.body-label-row{
  opacity:0;
  transform:translateY(5px);
}
.view-settled .article-heading-row{
  animation:articleHeadingSet .36s var(--ease) .01s both;
}
.view-settled .article-accent{
  animation:articleAccentSet .38s var(--ease) .07s both;
}
.view-settled .question{
  animation:articleQuestionSet .4s var(--ease) .11s both;
}
.view-settled .body-label-row{
  animation:articleBodyLabelSet .38s var(--ease) .17s both;
}
@keyframes articleHeadingSet{to{opacity:1;transform:none}}
@keyframes articleAccentSet{to{opacity:1;transform:none}}
@keyframes articleQuestionSet{to{opacity:1;transform:none}}
@keyframes articleBodyLabelSet{to{opacity:1;transform:none}}

/* Inline keyword: cue first, definition follows. */
.key-ref{
  isolation:isolate;
  overflow:visible;
}
.key-ref::after{
  content:"";
  position:absolute;
  left:4px;right:4px;bottom:1px;height:2px;
  border-radius:99px;
  background:var(--kw);
  opacity:.5;
  transform:scaleX(.28);
  transform-origin:left;
  transition:transform .2s var(--ease),opacity .2s var(--ease);
  pointer-events:none;
}
.key-ref:hover::after,.key-ref:focus::after,.key-ref.tip-open::after{
  transform:scaleX(1);opacity:.9;
}

/* One popover travels between terms rather than disappearing/reappearing. */
.keyword-popover{
  transition:
    opacity 120ms ease,
    transform 170ms var(--ease),
    left 210ms var(--ease),
    top 210ms var(--ease),
    border-color 180ms var(--ease),
    box-shadow 180ms var(--ease);
  will-change:left,top,transform,opacity;
}
.tip-term,.tip-desc{
  transition:opacity 90ms ease,transform 120ms var(--ease);
}
.tip-term.swapping,.tip-desc.swapping{
  opacity:.45;transform:translateY(2px);
}

/* Current article in the sidebar gently 'lands' instead of flashing. */
.topic-btn.active .topic-state{
  animation:topicDotLand .35s var(--ease) both;
}
@keyframes topicDotLand{
  from{opacity:0;transform:scale(.35);box-shadow:0 0 0 0 transparent}
  to{opacity:1;transform:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--area) 9%,transparent)}
}

/* Index overlay feels navigational, not modal-heavy. */
.index-overlay.open .overlay-area.current-area{
  scroll-margin-top:84px;
}
.index-close{
  transition:transform .22s var(--ease),background .18s,color .18s;
}
.index-close:hover{transform:rotate(4deg) scale(1.03)}

/* Tablet: floating index is especially important because the sidebar is hidden. */
@media(max-width:1180px) and (min-width:761px){
  .quick-index{
    right:18px;
    bottom:18px;
    width:92px;
    height:46px;
  }
}

/* Mobile: the centre of the fixed bottom navigator is the permanent menu affordance. */
@media(max-width:760px){
  .quick-index{display:none!important}
  .mobile-nav button:nth-child(2){
    position:relative;
    color:var(--theme);
    font-weight:900;
  }
  .mobile-nav button:nth-child(2)::before{
    content:"≡";
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;height:18px;
    margin-right:5px;
    border-radius:6px;
    background:color-mix(in srgb,var(--theme) 9%,white);
    color:var(--theme);
    vertical-align:-5px;
  }
  .mobile-nav button:nth-child(2):active{
    background:color-mix(in srgb,var(--theme) 8%,white);
  }
}

/* Avoid replaying decorative entry motion after scroll restoration. */
@media(prefers-reduced-motion:reduce){
  .article-heading-row,.article-accent,.question,.body-label-row{
    opacity:1!important;transform:none!important;animation:none!important;
  }
  .quick-index,.topic-btn.active .topic-state{animation:none!important}
  .keyword-popover{transition:opacity 100ms ease!important}
}

.home-hero .spectrum{

"area":"S","areaName":"歴史・記憶・時間"},{"id":94,"title":"進歩・断絶・歴史意識","area":"S","areaName":"歴史・記憶・時間"},{"id":95,"title":"過去・現在・未来・時間意識","area":"S","areaName":"歴史・記憶・時間"},{"id":96,"title":"近代化・合理化","area":"T","areaName":"近代・現代社会"},{"id":97,"title":"個人化・匿名化","area":"T","areaName":"近代・現代社会"},{"id":98,"title":"標準化・画一化・大衆社会","area":"T","areaName":"近代・現代社会"},{"id":99,"title":"人口・世代・少子高齢化","area":"T","areaName":"近代・現代社会"},{"id":100,"title":"加速・流動化・リスク社会","area":"T","areaName":"近代・現代社会"},{"id":101,"title":"グローバル化・越境・流動性","area":"U","areaName":"グローバル化・異文化"},{"id":102,"title":"異文化理解・文化相対主義・多文化共生","area":"U","areaName":"グローバル化・異文化"},{"id":103,"title":"移民・難民・ディアスポラ","area":"U","areaName":"グローバル化・異文化"},{"id":104,"title":"ナショナリズム・国民・文化的アイデンティティ","area":"U","areaName":"グローバル化・異文化"},{"id":105,"title":"植民地主義・ポストコロニアル・人種・民族","area":"U","areaName":"グローバル化・異文化"},{"id":106,"title":"空間・場所・風景・故郷","area":"V","areaName":"空間・都市・移動"},{"id":107,"title":"都市・建築・居住","area":"V","areaName":"空間・都市・移動"},{"id":108,"title":"地図・境界・領域","area":"V","areaName":"空間・都市・移動"},{"id":109,"title":"移動・交通・旅","area":"V","areaName":"空間・都市・移動"},{"id":110,"title":"観光・まなざし・場所の消費","area":"V","areaName":"空間・都市・移動"},{"id":111,"title":"災害・危機・レジリエンス","area":"W","areaName":"戦争・災害・平和"},{"id":112,"title":"戦争・平和","area":"W","areaName":"戦争・災害・平和"},{"id":113,"title":"暴力・非暴力・抵抗","area":"W","areaName":"戦争・災害・平和"},{"id":114,"title":"戦争記憶・証言・継承","area":"W","areaName":"戦争・災害・平和"},{"id":115,"title":"復興・和解・平和構築","area":"W","areaName":"戦争・災害・平和"},{"id":116,"title":"宗教・信仰・世界観","area":"X","areaName":"宗教・死生・超越"},{"id":117,"title":"神話・儀礼・聖と俗","area":"X","areaName":"宗教・死生・超越"},{"id":118,"title":"世俗化・宗教と社会","area":"X","areaName":"宗教・死生・超越"},{"id":119,"title":"死生観・喪失・弔い","area":"X","areaName":"宗教・死生・超越"},{"id":120,"title":"超越・救済・生の意味","area":"X","areaName":"宗教・死生・超越"}],"articles":[{"id":1,"area":"A","areaName":"言語・コミュニケーション","title":"言語と思考","question":"私たちは、まず考えが頭の中にあり、その内容を言葉にして外へ伝えているように感じる。けれども、ある言葉を知ったことで、それまで気づかなかった違いや関係が見えるようになることもある。言語は思考を表すだけなのか、それとも思考そのものを形づくっているのか。","body":"言語と思考の関係を考えるとき、まず押さえたいのは、言葉が単なる「伝達の道具」ではないという点である。私たちは「犬」「約束」「原因」のような名前を使い、ばらばらに見える経験を同じ種類としてまとめたり、逆に似ているものの間に境界を引いたりする。こうした区切りがあるからこそ、比較したり、説明したり、理由を考えたりする思考が可能になる。\n\nたとえば、同じ出来事でも「失敗」と呼ぶか「試行」と呼ぶかで、その経験の受け止め方は変わる。「障害」「個性」「異常」「多様性」といった言葉も、ただ対象を指すだけではなく、何を問題と見なし、何を受け入れるかという枠組みに関わる。名前を与えることは、世界をそのまま写すことではなく、世界をある仕方で切り分けることでもある。\n\nただし、すべての思考が言葉だけでできているわけではない。楽器を弾く感覚、スポーツの動き、映像としてよみがえる記憶などには、言葉にしきれない部分がある。それでも、そうした経験を言葉にした瞬間、他人と共有したり、自分で振り返ったりすることができるようになる。反対に、うまく名前を与えられない経験は、意識の外へこぼれやすい。\n\nこのテーマを扱う文章では、「言葉は現実を正確に表せるか」だけを考えない。筆者が、言葉によって現実の見え方や思考の枠組みそのものが変わると考えているのかを見ることが重要である。どんな名前が使われ、どんな境界が引かれているかを追うと、その文章がどのような世界の見方を提案しているのかが読みやすくなる。","keywords":[["言葉","経験や対象を区切り、共有できる形にする表現の体系。"],["名前","対象を一つのまとまりとして捉え、他と区別するために与える呼び名。"],["境界","連続した世界の中で、同じものと違うものを分ける区切り。"],["思考","比較、分類、推論などを通して物事を捉え関係づける働き。"],["枠組み","物事を見たり考えたりするときに前提となる区切り方や捉え方。"]]},{"id":2,"area":"A","areaName":"言語・コミュニケーション","title":"意味・文脈・語用","question":"同じ「もう遅いよ」という一言でも、時刻を知らせる場合もあれば、帰宅を促したり、相手をたしなめたりする場合もある。辞書に載っている意味は同じなのに、なぜ受け取られる意味は変わるのか。言葉の意味は、語そのものだけで決まるのだろうか。","body":"言葉の意味を理解するには、辞書に書かれた文字どおりの意味だけでは足りない。実際の会話では、誰が誰に向かって、どのような場面で、何のために言ったのかという文脈が加わって、発言の働きが決まる。文脈とは、前後の文章だけでなく、状況、人間関係、共有されている知識まで含む広い条件のことである。\n\nたとえば「窓が開いているね」という文は、事実を報告しているだけにも見える。しかし寒い部屋で先生が生徒に言えば、「閉めてほしい」という依頼として受け取られるかもしれない。話し手は必要なことを毎回すべて言葉にするわけではなく、聞き手が暗黙の前提を使って足りない部分を推測してくれることを期待している。\n\nそのため、誤解は単なる語彙不足から生じるとは限らない。「当然これくらいは分かっているはずだ」という前提がずれていたり、皮肉や婉曲表現を文字どおりに受け取ったりしたときにも意味はずれる。語の意味と、実際の場面で発言が果たす働きを区別する考え方が、語用を考える出発点になる。\n\n実際の読解では、一文を辞書的な意味だけで切り取らないことが大切である。「なぜこの場所で、この言い方をしているのか」を見る。反語、皮肉、引用、わざと距離を置いた表現などは、文脈を外すと読み違えやすい。語の意味、前後関係、筆者の狙いを重ねて読むことで、文章の本当の働きが見えてくる。","keywords":[["文脈","発言の意味を理解する際に手掛かりとなる、状況・前後関係・人間関係など。"],["推測","明示されていない意味を、文脈や前提から補って理解すること。"],["暗黙の前提","会話の参加者が共有しているものとして、省略されている知識や了解。"],["文字どおりの意味","語や文が慣習的にもつ、文脈による推測を加える前の基本的な意味。"],["話し手","発言を行い、その場の目的や関係の中で意味を伝える主体。"]]},{"id":3,"area":"A","areaName":"言語・コミュニケーション","title":"対話・コミュニケーション・相互理解","question":"コミュニケーションが成功したと言えるのは、相手と同じ意見になったときだろうか。結論には賛成できなくても、相手が何を大切にし、なぜそう考えたのかを理解することはできる。対話と相互理解は、意見の一致とどう違うのか。","body":"対話は、情報を一方から他方へ運ぶだけの作業ではない。話す、聞く、問い返す、言い換えるというやり取りを通して、互いの考えや前提を確かめ、ずれを調整していく過程である。つまり、共通の前提は最初から完全に共有されているのではなく、対話の途中で少しずつ作られていく。\n\nたとえば、「自由が大切だ」という二人がいても、一人は「他人に干渉されないこと」を自由と考え、もう一人は「自分で選べる条件があること」を自由と考えているかもしれない。同じ言葉を使っているからといって、同じ意味を共有しているとは限らない。そこで問い返しや言い換えを行うことで、ずれの場所が見えてくる。\n\n相互理解は、完全な一致や同意を意味しない。相手の結論に反対したままでも、その結論に至った理由や経験を理解することはできる。むしろ、違いを消してしまうより、「ここまでは共有できるが、ここから先は違う」と確認できることの方が、対話にとって重要な場合もある。\n\nこの話を読むうえでは「修復」も重要である。修復は、誤解や言い間違いなどのずれを、確認や言い直しによって調整すること。本文でこの語が出たら、前後の因果や対比と結びつけて読む。\n\n初見の文章にこの論点が出てきたら、単に「伝わった／伝わらなかった」で読まない。筆者が理解を、同じ考えになることとして捉えているのか、それとも差を残したまま関係を作ることとして捉えているのかを見る。対話、相互理解、共通の前提、問い返しといった語がどのように結びついているかを追うと、文章の人間観が見えてくる。","keywords":[["対話","複数の人が応答し合いながら、理解や関係を調整していくやり取り。"],["相互理解","互いの考えを完全に同一にするのではなく、必要な範囲で理解を共有すること。"],["共通の前提","会話の参加者が、互いに共有しているものとして扱う知識や状況。"],["問い返し","相手の意味を確認したり、ずれを修復したりするために質問を返すこと。"],["修復","誤解や言い間違いなどのずれを、確認や言い直しによって調整すること。"]]},{"id":4,"area":"A","areaName":"言語・コミュニケーション","title":"翻訳・言い換え・多言語性","question":"外国語を日本語に置き換えれば、翻訳は終わるのだろうか。同じ内容でも、文化や習慣が違えば、一語では対応しない言葉や、説明しなければ伝わらない表現がある。翻訳や言い換えでは、何を残し、何を変える必要があるのか。","body":"翻訳は、ある言語の語を別の言語の語へ一対一で置き換える作業ではない。言葉には、その社会の歴史や生活習慣、価値観が結びついているからである。翻訳する人は、元の表現が何を意味し、どのような響きをもつのかを考えながら、別の言語の中でできるだけ近い働きをする表現を選ぶ。\n\nたとえば、日本語の「よろしくお願いします」は、場面によって依頼、挨拶、関係づくりなど複数の働きをもつ。一つの英語表現へ機械的に置き換えることは難しい。逆に、外国語の一語を日本語で説明すると、数語から一文を必要とすることもある。ここでは、言い換えが大切になる。言い換えとは、表現の形を変えながら、伝えたい内容や機能をできるだけ保つことである。\n\n多言語性を考えると、言語が違うことは単なる不便ではなく、世界の切り取り方が複数あることを示す。ある言語では細かく区別されるものが、別の言語では一つの語でまとめられることもある。翻訳不能に見える部分は、文化の違いが最もよく現れる場所でもある。\n\nあわせて「目的」「差」も、このテーマの足場になる。「目的」は、翻訳や言い換えで、何を優先して伝えるかを決める用途やねらい。「差」は、二つの言語や表現が完全には重ならないこと。それぞれの役割を押さえておくと、具体例から抽象的な主張へ移りやすい。\n\n文章の論旨を追うときは、「正しい訳が一つあるか」だけを問題にしない。何を優先して言い換えたのか、どんな意味が残り、どんなニュアンスが失われたのかを見る。翻訳は、異なる言語や文化の間で意味を作り直す行為であり、その選択自体が一つの解釈なのである。","keywords":[["翻訳","異なる言語や表現の間で、意味や働きの対応関係をつくること。"],["言い換え","ある表現を別の表現へ置き換え、理解しやすい形に組み直すこと。"],["目的","翻訳や言い換えで、何を優先して伝えるかを決める用途やねらい。"],["外国語","異なる言語体系の間で意味や表現を移すときに生じる差を考える手掛かり。"],["差","二つの言語や表現が完全には重ならないこと。"]]},{"id":5,"area":"A","areaName":"言語・コミュニケーション","title":"言語変化・方言・標準語","question":"私たちは、今使っている言葉を昔から変わらないもののように感じやすい。しかし新しい言葉が生まれ、意味が変わり、地域によって違う言い方も存在する。言語変化や方言を考えるとき、「正しい日本語」とは何を意味するのだろうか。","body":"言語は、固定された規則の集まりではなく、人々が使う中で少しずつ変化する。発音が変わり、語の意味が広がったり狭まったりし、新しい表現が生まれる。言語変化は「乱れ」と同じではない。現在の標準的な表現の多くも、過去のある時点では新しい言い方だった。\n\n方言は、地域ごとに形成された語彙、発音、文法などのまとまりである。そこには、その土地の歴史や人間関係が刻まれている。一方、学校教育や行政、放送では、広い地域で通じやすい標準語が求められてきた。標準語には共通理解を助ける役割があるが、方言より本質的に優れているという意味ではない。\n\n問題になるのは、ある話し方が「正しい」「上品」とされ、別の話し方が「劣っている」と評価されるときである。言語には社会的な力関係が重なる。就職面接では標準語が有利でも、地域の共同体では方言が親しさや帰属を表すことがある。場面によって言葉の価値は変わる。\n\nこの論点を広げる語として「共通語」「規範」がある。「共通語」は、方言の違いを越えて、広い範囲で通じ合うために使われる言葉。「規範」は、ある場面で「こう使うのが望ましい」と共有される言葉の基準。文章中でこれらがどう結びつくかを見ると、筆者の整理の仕方が分かる。\n\n入試評論でも、正誤の問題だけにしない。誰の言葉が標準とされ、どの言葉が周辺へ追いやられたのかを見る。変化を「衰退」と捉える文章なのか、新しい生活に適応する動きと捉える文章なのかを見分けると、筆者の言語観が読み取れる。","keywords":[["言語変化","語彙・意味・発音・文法などが、時間とともに変わっていくこと。"],["方言","地域や集団の中で使われる、独自の語彙・発音・文法をもつ言葉の体系。"],["共通語","方言の違いを越えて、広い範囲で通じ合うために使われる言葉。"],["標準語","教育や公的な場などで、基準となる形として扱われる言葉。"],["規範","ある場面で「こう使うのが望ましい」と共有される言葉の基準。"]]},{"id":6,"area":"B","areaName":"記号・表象・物語","title":"記号・象徴・意味作用","question":"赤信号を見ると止まり、白い鳩を見ると平和を連想する。そこには、物そのものには含まれていない意味が働いている。記号や象徴は、どのようにして別のものを指し示し、私たちの理解や行動を導くのだろうか。","body":"記号とは、ある形や音が、それとは別の意味や対象を指し示すものである。文字、交通標識、数式、身ぶりなど、私たちの生活は記号で満ちている。重要なのは、記号の意味が物そのものに自然に入っているのではなく、社会の中で共有された約束や関係によって成立している点である。\n\nたとえば、赤い丸に斜線が引かれた標識を見て「禁止」と理解できるのは、その記号の読み方を学んでいるからだ。一方、象徴は、単に一つの情報を伝えるよりも広い意味を背負う。鳩が平和を、王冠が権威を、桜が日本やはかなさを象徴するように、一つの形が多くの文化的意味を呼び起こすことがある。\n\n記号の意味は、固定されているとは限らない。同じ象徴でも、時代や社会、立場によって受け取り方が変わる。国旗を誇りの象徴と見る人もいれば、過去の支配を思い出す人もいる。記号と意味の結びつきには、歴史や権力が入り込む。\n\nこのテーマでは「慣習」「解釈」という語も押さえておきたい。「慣習」は、社会の中で共有され、意味や使い方を支えている約束や習慣。「解釈」は、記号を何かの意味として受け取る働き。それぞれを区別すると、文章の論点が整理しやすい。\n\nここまでを踏まえて文章を読むなら、表面の形と、それが指している意味を分けて読む。「なぜこの形が、この意味を担うのか」「誰にとってその象徴が有効なのか」を考えるとよい。意味作用とは、記号が別の意味を生み出す働きであり、その関係を追うことが文章理解につながる。","keywords":[["記号","それ自体とは別の対象や意味を指し示すもの。"],["象徴","具体的な物や形を通して、広い価値や考えを表すもの。"],["慣習","社会の中で共有され、意味や使い方を支えている約束や習慣。"],["関係","一つの記号が、他の記号や状況とのつながりの中で意味をもつこと。"],["解釈","記号を何かの意味として受け取る働き。"]]},{"id":7,"area":"B","areaName":"記号・表象・物語","title":"比喩・修辞・表現効果","question":"「人生は旅だ」と言うとき、人生が本当に道路や列車になるわけではない。それでも私たちは、その比喩から出発点、分岐、目的地などを連想できる。比喩や修辞は、文章を飾るだけなのか。それとも物事の見方そのものを変えるのか。","body":"比喩は、あるものを別のものになぞらえて理解する表現である。「時間はお金だ」「心に壁がある」といった言い方では、本来異なる二つの領域が結びつけられる。その結果、見えにくかった特徴が目立つようになる。比喩は、説明を分かりやすくするだけでなく、何に注目するかを方向づける。\n\n修辞とは、言葉の並べ方や繰り返し、対比、反語などを工夫し、読み手への働きかけを強める表現技法である。たとえば「便利になった。豊かになった。では、幸せになったのか。」と並べれば、最後の問いが強く響く。文章の形そのものが、読者の感じ方や考え方を動かしている。\n\nただし比喩には、見せるものと同時に隠すものがある。「社会は機械だ」と捉えれば、部品の役割や効率は見えやすくなるが、人間の感情や偶然性は見えにくくなる。どんな比喩も現実の一部を強調し、別の部分を背景へ退ける。\n\n議論を追うために、「前景化」「表現形式」も確認しておこう。「前景化」は、ある特徴を目立たせ、読み手の注意をそこへ向けること。「表現形式」は、言葉の形や配置が、内容の見え方や考え方を方向づける働き。日常語の印象ではなく、この意味で読み分けることが大切である。\n\n本文中にこの概念が現れたら、比喩を単なる飾りとして飛ばさない。「何と何を重ねているのか」「その結果、どの特徴が強調されているのか」を確認する。比喩や修辞は、筆者の論理と価値判断を短い形で表すことが多い。そこを押さえると、文章の方向がつかみやすい。","keywords":[["比喩","あるものを別のものになぞらえ、共通点や連想を通して理解する表現。"],["修辞","言葉の配置や表現を工夫し、理解や印象に働きかける方法。"],["前景化","ある特徴を目立たせ、読み手の注意をそこへ向けること。"],["対比","二つのものを並べ、その違いや関係を際立たせる表現。"],["表現形式","言葉の形や配置が、内容の見え方や考え方を方向づける働き。"]]},{"id":8,"area":"B","areaName":"記号・表象・物語","title":"物語・語り・ナラティブ","question":"同じ出来事でも、誰を主人公にし、どこから話し始め、何を原因として結びつけるかで、全く違う物語になる。物語は事実を並べたものではない。語りやナラティブは、出来事にどのような順序と意味を与えるのだろうか。","body":"物語とは、出来事を時間や因果のつながりの中に配置し、「何が起こり、それが何を意味したのか」を理解できる形にしたものである。現実の出来事は無数にあるが、物語ではその一部が選ばれ、始まりと終わりが与えられる。語りとは、その出来事を誰の視点から、どんな順序で伝えるかという行為である。\n\nたとえば、ある会社の倒産を「経営者の判断ミスの物語」と語ることも、「産業構造の変化に取り残された物語」と語ることもできる。選ぶ原因や登場人物が違えば、責任の見え方も変わる。ナラティブという語は、このように出来事を一つの筋道へまとめ、意味を与える語りの枠組みを指すことが多い。\n\n物語には、人を理解させる力がある一方、複雑な現実を単純化する危険もある。「努力したから成功した」「失敗したのは本人が怠けたから」といった分かりやすい物語は、制度や偶然の影響を消してしまうことがある。筋が通っていることと、説明として十分であることは同じではない。\n\n読解の場面では、内容だけでなく構成を見る。何が始まりとされ、何が原因とされ、誰の視点が中心に置かれているか。さらに、その語りから外れている出来事や人がいないかを考える。物語の作られ方を見ることは、文章が現実をどう意味づけているかを読むことなのである。","keywords":[["物語","出来事を選び、時間や因果関係で結びつけて理解可能な形にしたもの。"],["語り","出来事をどの順序・方法・視点で示すかという働き。"],["視点","誰の位置や立場から出来事を見るかという枠組み。"],["因果","出来事同士を原因と結果のつながりとして結びつけること。"],["意味づけ","出来事を選び、つなぎ、まとまりあるものとして理解すること。"]]},{"id":9,"area":"B","areaName":"記号・表象・物語","title":"イメージ・表象・再現","question":"写真や映像は、現実をそのまま写しているように見える。しかし、何を画面に入れ、どの瞬間を切り取り、どんな説明を添えるかで印象は大きく変わる。イメージや表象は、現実を再現するだけなのか。","body":"表象とは、現実の人や物、出来事を、言葉・画像・映像など別の形で示すことである。私たちは現実そのものにいつも直接触れられるわけではなく、新聞記事、写真、地図、映画などの表象を通して世界を知る。再現とは、現実をもう一度見える形にすることだが、完全な複製ではない。\n\n写真を例にすると分かりやすい。カメラは現実にあったものを写すが、撮影者は位置、角度、明るさ、瞬間を選ぶ。同じ集会でも、密集した部分だけを撮れば大規模に見え、空いた場所を含めれば少なく見える。イメージには、必ず選択が入り込む。\n\nだから「作られているから嘘だ」と考えるのも単純すぎる。どんな表象にも選択があるからこそ、何が選ばれたのかを確かめる必要がある。特定の集団がいつも同じ姿で描かれれば、そのイメージが現実についての固定観念を生むこともある。\n\nもう少し用語を整えておく。「媒体」「切り取り」が重要になる。「媒体」は、情報や表現を伝えるために用いられる、言葉・写真・映像などの手段。「切り取り」は、現実の一部を選んで表象し、画面や文章の外側を見せないこと。こうした区別を持って読むと、似た概念を混同しにくい。\n\nこの分野の文章では、「現実か虚構か」の二択にしない。誰が、何を、どんな形式で再現し、何を見えなくしているのかを見る。表象は現実を伝える窓であると同時に、現実の見え方を組み立てる枠でもある。","keywords":[["表象","対象や出来事を、言葉・画像・記号などによって示すこと。"],["再現","現実の対象や出来事を、別の媒体や形式で表し直すこと。"],["媒体","情報や表現を伝えるために用いられる、言葉・写真・映像などの手段。"],["切り取り","現実の一部を選んで表象し、画面や文章の外側を見せないこと。"],["選択","何を示し、何を省くかを決めること。"]]},{"id":10,"area":"B","areaName":"記号・表象・物語","title":"分類・命名・カテゴリー","question":"「子ども／大人」「正常／異常」「自然／人工」のように、私たちは物事を分類して理解している。しかし、その境界は本当に最初から世界に存在するのだろうか。分類や命名は、理解を助ける一方で何を作り出すのか。","body":"分類とは、似た特徴をもつものを同じ集団としてまとめ、別のものと区別することだ。カテゴリーは、そのときに使われる「種類」の枠である。分類があるからこそ、私たちは膨大な情報を整理し、「これは以前見たものと同じ仲間だ」と素早く判断できる。\n\nしかし、現実には境目がはっきりしないものも多い。年齢で「子ども」と「大人」を分ける線、病気と健康を分ける基準、方言と言語を分ける基準などは、自然の中に一本の線として存在しているわけではない。社会の目的や制度に応じて、どこかに境界を置いている。\n\n命名にはさらに強い働きがある。ある状態に名前がつくと、それまでばらばらだった経験を一つの問題として認識しやすくなる。一方で、名前が人を固定的に捉えるラベルになることもある。分類は理解の道具であると同時に、扱い方や制度の対象を決める力ももつ。\n\n用語として「分類の境界」も確認しておこう。これは、ある対象を一つのカテゴリーに含めるか外すかを決める区切りという意味である。意味を先に押さえると、その後の具体例が理解しやすくなる。\n\n筆者の主張をつかむには、「その区分が正しいか」だけでなく、「誰が、何の目的で、その境界を引いたのか」を見る。筆者が既存のカテゴリーを使って説明しているのか、それともカテゴリーそのものを問い直しているのか。この違いを見抜くと、文章の論点が格段に読みやすくなる。","keywords":[["分類","複数の対象を、共通する特徴や目的に応じていくつかのまとまりに分けること。"],["カテゴリー","分類によって作られた、同じ種類として扱われる対象のまとまり。"],["境界","あるカテゴリーと別のカテゴリーを分ける区切り。目的によって引き方が変わることがある。"],["命名","対象や区別に名前を与え、他者と共有可能なものにすること。"],["分類の境界","ある対象を一つのカテゴリーに含めるか外すかを決める区切り。"]]},{"id":11,"area":"C","areaName":"文学・読解・解釈","title":"文学の価値と役割","question":"文学作品は、役に立つ情報や正しい答えを直接教えてくれるとは限らない。それでも人は小説や詩を読み続けてきた。文学には、知識の伝達とは異なるどのような価値があり、私たちの経験や想像力に何をもたらすのだろうか。","body":"文学は、物語や詩的な言葉を通して、人間の経験を別の角度から捉え直す表現である。ここでいう価値は、すぐに役立つ実用性だけを意味しない。ある人物の迷いや痛みを追体験したり、普段なら言葉にしにくい感覚に形を与えたりすることも、文学の重要な働きである。\n\nたとえば、小説を読んだからといって、現実の他者を完全に理解できるわけではない。それでも、自分とは違う立場の人物の視点に一時的に身を置くことで、ものの見え方が一つではないことに気づく。文学は、正解を教えるよりも、簡単には答えが出ない問いの中に読者をとどまらせることがある。\n\nまた、文学は社会から切り離された美しい作品だけではない。ある時代の価値観を映したり、逆にその価値観を批判したりする。読者が作品に価値を感じる理由も、時代によって変わる。文学の価値は作品の内部だけでなく、読者や社会との関係の中でも作られる。\n\nこの論点を広げる語として「想像力」「読書」「効用」がある。「想像力」は、直接経験していない状況や他者の立場を思い描く力。「読書」は、作品の言葉や形式をたどり、意味や経験を作る行為。「効用」は、あるものが別の目的に役立つ働きや効果。文章中でこれらがどう結びつくかを見ると、筆者の整理の仕方が分かる。\n\n文章を読む際に注目したいのは、「役に立つ／役に立たない」という対立に注意する。筆者が文学を、共感の装置、言葉の実験、社会批判、自己理解などのどこに位置づけているかを見る。文学が何を可能にするものとして語られているかをつかむことが、論旨を読む手掛かりになる。","keywords":[["文学","言葉の形式や物語を通して、人間や世界を表現し考える営み。"],["価値","何を大切だと認めるかという判断の基準。"],["想像力","直接経験していない状況や他者の立場を思い描く力。"],["読書","作品の言葉や形式をたどり、意味や経験を作る行為。"],["効用","あるものが別の目的に役立つ働きや効果。"]]},{"id":12,"area":"C","areaName":"文学・読解・解釈","title":"作者・読者・テクスト","question":"作品の意味を知りたいとき、作者が「本当はこういう意味で書いた」と言えば、それが唯一の正解になるのだろうか。文章は作者の手を離れたあとも読まれ続ける。作者・読者・テクストの関係をどう考えればよいのか。","body":"文学や文章を読むとき、作者の意図は重要な手掛かりになる。しかし、作品の意味を作者の意図だけで決めてしまうと、実際のテクストに書かれていることや、読者が読み取る働きを軽く見てしまう。テクストとは、作者から独立して読まれうる、具体的な言葉のまとまりである。\n\nたとえば作者が「希望を描いた」と説明していても、作品中に絶望を強く示す表現が繰り返されているなら、読者はその緊張関係を無視できない。逆に、作者の生涯や時代背景を知ることで、表現の意味が深く理解できる場合もある。作者を無視すればよいわけでも、作者の発言に従えばよいわけでもない。\n\n読者も好き勝手に意味を作れるわけではない。解釈には、語句、構成、比喩、反復など、テクスト上の根拠が必要である。同じ作品に複数の読みが成立しても、そのすべてが同じ説得力をもつわけではない。\n\nここで「文脈」という語も押さえておきたい。文脈とは、ある語や表現の意味を支える、文章内外の状況やつながり。この意味を知っておくと、文章中でこの語が担う役割を追いやすくなる。\n\nこの論点を読むときは、「意味はどこにあると考えているか」を確認する。作者の意図に置くのか、テクストの構造に置くのか、読者との出会いの中に置くのか。どこを重視するかによって、作品理解の考え方そのものが変わる。","keywords":[["作者","文章や作品を作った人物。背景や目的は解釈の手掛かりになるが、意味を単独で決めるわけではない。"],["テクスト","実際に書かれ、読者が直接読む言葉・構成・表現のまとまり。"],["読者","テクストを読み、自分の知識や経験を使いながら意味を組み立てる側。"],["解釈","文章中の根拠や文脈をもとに、その意味や関係を説明すること。"],["文脈","ある語や表現の意味を支える、文章内外の状況やつながり。"]]},{"id":13,"area":"C","areaName":"文学・読解・解釈","title":"解釈・読み・意味生成","question":"同じ文章を読んでも、読者によって理解が異なることがある。それなら解釈は何でもありなのだろうか。それとも、本文中の言葉や構成に支えられた、より妥当な読み方があるのだろうか。意味はどこで生まれるのか。","body":"解釈とは、書かれた言葉を手掛かりに、その文章が何を意味しているかを組み立てることである。テクストは文字としてそこにあるが、その意味が自動的に一つだけ現れるわけではない。読者は、語句の関係、前後の文脈、自分の知識などを使いながら読みを作る。\n\nだから、同じ文章に複数の解釈が生まれることは珍しくない。しかし「どんな読み方でもよい」という意味ではない。たとえば、本文で何度も対立させられている二つの概念を無視した解釈や、書かれていない情報だけに頼る解釈は説得力が弱い。読みには、テクスト上の根拠が必要である。\n\n意味生成という考え方は、意味を「最初から完成したものを取り出す作業」ではなく、文章と読者の関係の中で具体化していくものとして捉える。ただし、読者の自由と本文の制約は両方ある。この二つの間をどう考えるかが、解釈の大きな論点になる。\n\nもう一つ鍵になるのが「多義性」である。ここでは、一つの表現や文章が、複数の意味の可能性をもつことという意味で使う。この語がどこに置かれるかで、議論の焦点が見えやすい。\n\nこのテーマを扱う文章では、自分の印象だけで結論を出さず、「どの表現を根拠にそう読めるのか」を示す習慣が大切である。筆者の主張を読む場合も同じで、意味の取り方を支える語句、対比、言い換えを探す。解釈とは、自由な感想ではなく、根拠をもって意味を組み立てる行為なのである。","keywords":[["解釈","文章の語句・構成・文脈などを根拠に、意味を組み立てること。"],["テクスト","解釈の対象となる、書かれた言葉やその構成。"],["文脈","語句や文章の意味を判断するための前後関係や背景。"],["根拠","ある読み方が妥当だと説明するために示される、文章上の手掛かり。"],["多義性","一つの表現や文章が、複数の意味の可能性をもつこと。"]]},{"id":14,"area":"C","areaName":"文学・読解・解釈","title":"フィクション・想像力・現実","question":"小説の出来事は実際には起きていなくても、読者の考え方や社会の価値観に影響を与えることがある。フィクションは「嘘」だから現実とは無関係なのか。それとも、想像力を通して現実を別の仕方で理解させるのか。","body":"フィクションとは、実際の出来事をそのまま記録するのではなく、作られた人物や出来事を用いて世界を描く表現である。事実ではないという点では現実と区別されるが、だから価値がないわけではない。想像力によって、現実には経験していない状況を考えることができる。\n\nたとえば、未来社会を描く小説は、まだ存在しない社会を描きながら、現在の技術や制度の問題を照らし出すことがある。架空の人物の差別経験を読むことで、読者が現実の制度について考え直すこともある。フィクションは、現実から逃げるだけでなく、現実を見る距離を作る。\n\nもちろん、フィクションを現実の証拠として扱うことはできない。小説に描かれた一人の人物から、ある集団全体の特徴を決めることはできない。しかし、何が想像可能とされ、どんな未来が恐れられ、どんな生き方が望ましいと描かれるかには、その社会の価値観が表れる。\n\nここで関係する用語が「可能性」「想像された世界」である。「可能性」は、現実には起きていないが、条件次第では起こりうるあり方。「想像された世界」は、現実には存在しなくても、作品の中で一貫した状況として思い描かれる世界。どの語が原因・結果・評価のどこに置かれているかを見るとよい。\n\n実際の読解では、「本当か嘘か」だけで判断しない。筆者が想像力を、現実逃避、共感、思考実験、社会批判のどの働きと結びつけているかを見る。現実とは異なる世界を描くことが、現実の理解にどう戻ってくるのかを追うとよい。","keywords":[["フィクション","現実の事実をそのまま報告するのではなく、作られた人物や出来事を示す表現。"],["想像力","直接経験していない状況や可能性を、頭の中で組み立てる力。"],["可能性","現実には起きていないが、条件次第では起こりうるあり方。"],["想像された世界","現実には存在しなくても、作品の中で一貫した状況として思い描かれる世界。"],["現実","実際に起きている出来事や存在している社会との関係。"]]},{"id":15,"area":"C","areaName":"文学・読解・解釈","title":"文学と社会・歴史","question":"文学作品は作者個人の想像から生まれるように見えるが、使われる言葉や価値観、登場人物の生き方には、その時代の社会や歴史が入り込む。作品は社会を映す鏡なのか。それとも社会の見方そのものを変える力ももつのか。","body":"文学作品は、時代や社会から完全に切り離して生まれるわけではない。作者は、その時代に使われている言葉、制度、常識の中で書く。したがって作品には、家族観、仕事観、男女の役割、国家への意識など、その社会で当たり前とされていた考え方が入り込む。\n\nそのため文学は、歴史を知る資料にもなる。ただし、作品を社会の単純な写しとして読むのは危険である。作家は現実をそのまま記録するのではなく、選び、誇張し、組み替え、時には批判する。ある時代の偏見を作品がそのまま再生している場合もあれば、あえて揺さぶっている場合もある。\n\n逆に文学が社会へ影響することもある。ある人物像や物語が広く読まれることで、新しい生き方が想像され、それまで見えにくかった問題に名前が与えられることがある。作品と社会は、一方が他方を映すだけの関係ではなく、互いに影響し合う。\n\nもう少し用語を整えておく。「沈黙」「反映」が重要になる。「沈黙」は、作品の中で語られず、声を与えられていない部分。「反映」は、社会の特徴が作品の内容や表現に現れること。こうした区別を持って読むと、似た概念を混同しにくい。\n\n初見の文章にこの論点が出てきたら、「作品の中に時代がどう表れているか」と「作品が時代にどう働きかけたか」を分けて考える。個人の表現と社会的条件のどちらか一方に還元せず、その往復を見ることが重要である。","keywords":[["時代","作品が書かれ、読まれる社会的・歴史的な条件。"],["社会","人々の関係や制度、慣習が組み合わさって成り立つ生活の場。"],["作品","社会や時代と関わりながら作られ、後の読者にも読まれる表現。"],["沈黙","作品の中で語られず、声を与えられていない部分。"],["反映","社会の特徴が作品の内容や表現に現れること。"]]},{"id":16,"area":"D","areaName":"文化・芸術・美","title":"生活文化・大衆文化・遊び・スポーツ","question":"音楽、ファッション、ゲーム、スポーツ、食事の作法など、私たちの日常には多くの文化がある。こうした生活文化や大衆文化を「高尚な芸術より軽いもの」と考えてよいのだろうか。遊びや娯楽には、社会の価値観がどう表れるのか。","body":"生活文化とは、食事、服装、住まい、習慣など、日常生活の中で受け継がれ実践される文化である。大衆文化は、映画、音楽、漫画、ゲーム、テレビ、スポーツなど、多くの人が共有し消費する文化を指すことが多い。どちらも、特別な芸術作品だけでは捉えられない社会の姿を示している。\n\nたとえば、スポーツには勝敗だけでなく、身体の理想、性別役割、国家意識、商業化などが関わる。ゲームにも、競争や協力のルール、成功の条件、世界観が埋め込まれている。遊びは「何の役にも立たない時間」に見えても、人間関係を作ったり、新しいルールを試したりする場になる。\n\nまた、大衆文化は市場と強く結びつくため、「売れるもの」が広まりやすい。流行が自由な選択のように見えても、広告やメディアの影響を受けていることがある。一方で、受け手が作品を独自に読み替え、新しい文化を作り出すこともある。\n\n文章の論旨を追うときは、「高級／低級」「役に立つ／無駄」といった単純な評価を疑う。誰が作り、誰が楽しみ、どんな価値観や社会関係がそこで再生産されているのかを見ると、日常の中にある文化の意味が読める。","keywords":[["生活文化","食事・服装・住まいなど、日常生活の中で共有される習慣や価値観。"],["大衆文化","多くの人に広く流通し、消費される娯楽や表現。"],["受け手","作品や商品を受け取り、自分なりに意味づけたり利用したりする側。"],["遊び","楽しさや自発性を伴いながら、一定の規則や約束の中で行われる活動。"],["スポーツ","身体活動、規則、競争、観戦などが社会的に組織された文化実践。"],["市場","文化的な作品や活動が商品として流通する経済的な仕組み。"]]},{"id":17,"area":"D","areaName":"文化・芸術・美","title":"芸術の価値と機能","question":"芸術作品には、実用的な道具のような明確な用途がないことが多い。それでも私たちは、美術館へ行き、音楽を聴き、作品を保存する。芸術の価値は「美しいこと」にあるのか、それとも経験や社会を変える別の機能があるのか。","body":"芸術という言葉は、絵画、音楽、演劇、映画など、人間が感覚や形式を通して表現する多様な活動を含む。芸術の価値を考えるとき、まず「役に立つかどうか」だけでは測れない点を押さえたい。作品を見る経験そのものが、普段のものの見方や感じ方を揺さぶることがあるからだ。\n\nたとえば、戦争を描いた絵がすぐに戦争を止めるわけではない。それでも、統計では伝わりにくい恐怖や喪失を具体的な経験として感じさせることがある。抽象画のように、明確なメッセージがない作品でも、色や形への注意を変え、新しい知覚の仕方を開くことがある。\n\n一方で、芸術は社会や政治と無関係ではない。権力をたたえる作品もあれば、社会を批判する作品もある。市場で高い価格がつくことと、芸術的な価値が高いことも同じではない。価値には、美的経験、歴史的意義、社会的機能など複数の基準がある。\n\nこの論点を広げる語として「制度」「鑑賞」がある。「制度」は、作品の制作・展示・評価などを支える社会的な仕組み。「鑑賞」は、作品に注意を向け、感じたり考えたりしながら経験すること。文章中でこれらがどう結びつくかを見ると、筆者の整理の仕方が分かる。\n\n入試評論でも、「芸術は何のためにあるのか」という問いに、筆者がどのような答えを出しているかを見る。美、感動、批判、共同体、自己表現など、どの機能を重視しているかが分かれば、その文章の価値観が見えてくる。","keywords":[["芸術","感覚・形式・表現を通して、人間や世界を示し考える文化的な営み。"],["経験","作品に触れること自体から生まれる感動、違和感、発見など。"],["社会","芸術が記憶、批判、共同性などを通して関わる人々の世界。"],["制度","作品の制作・展示・評価などを支える社会的な仕組み。"],["鑑賞","作品に注意を向け、感じたり考えたりしながら経験すること。"]]},{"id":18,"area":"D","areaName":"文化・芸術・美","title":"美意識・感性・鑑賞","question":"同じ絵を見ても、美しいと感じる人もいれば、何も感じない人もいる。美意識や感性は生まれつきのものなのか、それとも経験や教育、社会によって育てられるのか。鑑賞とは、単に「好き嫌い」を述べることなのだろうか。","body":"美意識とは、何を美しい、魅力的、心地よいと感じるかに関わる判断の傾向である。感性は、色、音、形、雰囲気などを受け取り、細かな違いに反応する働きと考えられる。こうした感じ方には個人差があるが、完全に生まれつきで決まるわけではない。\n\nたとえば、音楽を学ぶと、それまで一つの音の流れにしか聞こえなかったものから、リズムや和音の違いを聞き分けられるようになる。絵画でも、技法や時代背景を知ることで見えるものが増える。経験や知識は、感性を鈍らせるのではなく、むしろ感じ取れる範囲を広げることがある。\n\n一方、「美しい」とされる基準には社会や時代の影響もある。身体の理想、建築の好み、色の意味などは変化する。個人の感覚だと思っているものにも、教育、流行、階層などが関わっている可能性がある。\n\nここで「美的判断」という語も押さえておきたい。美的判断とは、対象を美しい、優れているなどと評価する判断。この意味を知っておくと、文章中でこの語が担う役割を追いやすくなる。\n\nここまでを踏まえて文章を読むなら、「主観だから説明できない」で終わらせない。感じ方がどのように形成されたのか、知識が鑑賞に何を加えるのかを読む。鑑賞は、好き嫌いを表明するだけでなく、自分が何に反応したのかを言葉にし、作品との関係を深める行為である。","keywords":[["美意識","何を美しいと感じ、価値づけるかに関わる感覚や考え方。"],["感性","色・音・形・雰囲気などの違いを感じ取る力。"],["鑑賞","作品に注意を向け、感じ、考えながら経験を深めること。"],["美的判断","対象を美しい、優れているなどと評価する判断。"],["経験","作品に触れ、感じ方や見方が変化していく鑑賞の過程。"]]},{"id":19,"area":"D","areaName":"文化・芸術・美","title":"創造・模倣・複製","question":"新しい作品は、何もないところから突然生まれるのだろうか。多くの芸術や技術は、過去の作品をまねたり組み替えたりしながら作られてきた。創造と模倣、さらに複製は、どこで区別されるのか。","body":"創造というと、完全に新しいものを一から生み出すことを想像しやすい。しかし実際の創作は、すでに存在する形式、技法、物語、言葉などを学び、それらを組み替えるところから始まることが多い。模倣は、単なるコピーではなく、技術を身につけたり、既存の形式を理解したりする重要な方法でもある。\n\nたとえば、絵を学ぶ人が名画を写すのは、元の作品を盗むためではなく、線や構図の仕組みを身体で理解するためである。音楽でも、過去の旋律や形式を引用しながら新しい作品が作られる。どの程度の変化があれば「創造」と呼べるかは、文化や制度によっても異なる。\n\n複製の意味も、写真やデジタル技術によって大きく変わった。同じ画像をほぼ劣化なく無数にコピーできると、「唯一の本物」にどんな価値があるのかが問われる。一方、複製によって多くの人が作品へアクセスできるようになる利点もある。\n\n議論を追うために、「独創性」「新しさ」も確認しておこう。「独創性」は、既存のものとは異なる新しい特徴や見方を生み出す性質。「新しさ」は、既存のものとの差や組み替えによって生まれる独自の性質。日常語の印象ではなく、この意味で読み分けることが大切である。\n\n本文中にこの概念が現れたら、「オリジナル／コピー」の単純な二択に注意する。何を受け継ぎ、何を変えたのか、複製によって価値や受け取り方がどう変化したのかを見る。創造とは、過去との関係を断つことではなく、その関係を作り替えることとして論じられる場合が多い。","keywords":[["創造","既存の材料や形式を組み替え、新しい関係や表現を生み出すこと。"],["模倣","先行するものをまね、学び、再現すること。"],["独創性","既存のものとは異なる新しい特徴や見方を生み出す性質。"],["複製","元の作品や情報を別の形で再び作ること。"],["新しさ","既存のものとの差や組み替えによって生まれる独自の性質。"]]},{"id":20,"area":"D","areaName":"文化・芸術・美","title":"伝統・慣習・継承・文化変容","question":"伝統は、昔から同じ形のまま守られてきたもののように見える。しかし、続いている慣習ほど、時代に合わせて少しずつ変化していることも多い。継承するとは、変えずに残すことなのか、それとも変えながら続けることなのか。","body":"慣習とは、ある社会や集団の中で繰り返され、当たり前のやり方として定着した行為や考え方である。伝統は、その中でも過去から受け継がれてきたものとして価値づけられた実践を指すことが多い。ここで重要なのは、古いものすべてが自動的に伝統になるわけではないという点である。\n\n祭りや料理、衣服などを見ても、昔と全く同じ形で続いているものは少ない。材料が変わり、担い手が変わり、観光客向けの工夫が加わることもある。それでも人々が「この共同体の大切なもの」として意味を与え続ければ、伝統として継承される。\n\n逆に、「伝統だから変えてはいけない」という言葉が、現在の権力関係や役割分担を正当化するために使われることもある。何を伝統と呼ぶか、誰がその定義を決めるかには注意が必要である。文化変容は、伝統の消滅だけではなく、新しい形への組み替えでもある。\n\nなお、「保存」は、過去から受け継いだものを残し、次へ渡そうとする働きという意味である。似た日常語の感覚だけで読まず、この意味に戻ると論点を取り違えにくい。\n\n読解の場面では、「昔からある」というだけで納得しない。何が残され、何が変えられ、誰が継承の担い手になっているのかを見る。筆者が伝統を固定された遺産として捉えるのか、変化しながら続く実践として捉えるのかが、文章の中心的な対立になることがある。","keywords":[["慣習","集団の中で繰り返され、当たり前のものとして共有されている行動や規則。"],["伝統","過去から受け継がれてきたものとして意識される文化や慣習。"],["継承","文化や技術、価値観などを次の人や世代へ受け渡すこと。"],["変化","受け継ぐ過程で、形式や意味が時代や状況に応じて変わること。"],["保存","過去から受け継いだものを残し、次へ渡そうとする働き。"]]},{"id":21,"area":"E","areaName":"人間・自己・他者","title":"人間存在・人間観・人間性","question":"「人間らしさ」と聞くと、理性、言葉、感情、道徳などが思い浮かぶ。しかし、人間をどの特徴で定義するかによって、動物や機械との境界も変わる。評論で語られる人間観や人間性は、何を前提にしているのだろうか。","body":"人間観とは、人間とはどのような存在かについての基本的な捉え方である。人間性という語は、人間に固有だと考えられる性質や、人間らしいあり方を指すために使われる。しかし、何を「人間らしい」とするかは一つではない。理性を重視する考えもあれば、感情、社会性、身体性を重視する考えもある。\n\nたとえば、人間を「合理的に考える存在」と定義すると、感情に動かされる行動は人間らしさから外れて見えるかもしれない。逆に、人間を「他者との関係の中で生きる存在」と捉えれば、依存や共感も重要な人間性になる。定義の仕方によって、理想とされる人間像は変わる。\n\nまた、人間の特徴だと思われていた能力の一部は、動物にも見られたり、AIや機械が実行できるようになったりしている。そのたびに「人間だけにできることは何か」という問いは更新される。人間とそれ以外の境界は、科学や技術の変化によっても揺れる。\n\nもう少し用語を整えておく。「本質」「可塑性」「規範」が重要になる。「本質」は、そのものをそのものとして成り立たせる、変わらない中心的な性質。「可塑性」は、経験や環境によって性質や行動のあり方が変わりうること。「規範」は、人がどう行動すべきか、何を望ましいとするかという基準。こうした区別を持って読むと、似た概念を混同しにくい。\n\nこの分野の文章では、筆者がどの性質を人間の中心に置いているかを確認する。理性、自由、身体、言語、共同性など、何を強調するかによって主張全体が変わる。人間観は文章の前提になりやすいため、明示されていなくても丁寧に読み取る必要がある。","keywords":[["人間観","人間をどのような存在として捉えるかという基本的な見方。"],["人間性","人間に共通すると考えられる性質や傾向。"],["本質","そのものをそのものとして成り立たせる、変わらない中心的な性質。"],["可塑性","経験や環境によって性質や行動のあり方が変わりうること。"],["規範","人がどう行動すべきか、何を望ましいとするかという基準。"]]},{"id":22,"area":"E","areaName":"人間・自己・他者","title":"自己・主体・アイデンティティ","question":"「自分らしく生きる」と言うとき、その「自分」は最初から完成しているのだろうか。家族、学校、社会から影響を受けながらも、自分で選び直すこともある。自己・主体・アイデンティティは、どのように作られていくのか。","body":"自己とは、自分を自分として感じ、経験や記憶を一つのまとまりとして捉える感覚である。主体とは、周囲に動かされるだけでなく、自分で考え、選び、行為する存在としての側面を強調する語である。アイデンティティは、「自分は何者か」という理解や所属意識を指す。\n\n私たちは、何もないところから自由に自己を作るわけではない。名前、家族、性別、国籍、学校、言語など、多くの条件をすでに与えられて生き始める。その中で、他者からどう見られるかを受け取り、自分でも自分を説明しながら、自己像を形づくっていく。\n\nしかし、社会から与えられた役割をそのまま受け入れるだけでもない。「こうあるべきだ」と期待された生き方を拒んだり、複数の所属を組み合わせたりすることもできる。主体性とは、すべてを自由に選べることではなく、与えられた条件の中で選び直す力として考えることもできる。\n\n用語として「連続性」も確認しておこう。これは、過去の経験と現在の自分をつなぎ、一人の自己として捉える感覚という意味である。意味を先に押さえると、その後の具体例が理解しやすくなる。\n\n筆者の主張をつかむには、「個人の内面だけの問題」として読まない。筆者が社会的条件をどこまで重視しているか、逆に個人の選択や抵抗をどこまで認めているかを見る。固定された自己と、関係の中で変化する自己のどちらに重点を置くかが重要な論点になる。","keywords":[["自己","自分自身についてもつ感覚や理解のまとまり。"],["主体","状況に働きかけ、自分で判断し行為する側として捉えられた人間。"],["アイデンティティ","自分は何者で、何に属し、何を大切にする人間かという自己理解。"],["役割","ある関係や立場の中で、その人に期待される行動や位置づけ。"],["連続性","過去の経験と現在の自分をつなぎ、一人の自己として捉える感覚。"]]},{"id":23,"area":"E","areaName":"人間・自己・他者","title":"他者・異質性・関係性","question":"自分と似た人なら理解しやすいが、価値観や経験が大きく異なる相手を前にすると、私たちは自分の基準で相手を判断しがちである。「他者」を理解するとは、相手を自分と同じにすることなのか。","body":"他者とは、単に自分以外の人というだけでなく、自分の理解や価値観では完全には捉えきれない存在という意味で使われることがある。異質性とは、相手が自分とは違う経験や背景をもち、その違いが簡単には消えないことを指す。人間関係は、こうした違いを含んだまま成り立っている。\n\n他者を理解しようとするとき、私たちは「自分だったらどう感じるか」と考える。これは共感の手掛かりになるが、同時に危険もある。自分の経験をそのまま相手に当てはめれば、相手固有の事情を見失うからだ。「分かったつもり」になることも、他者を消す一つの形である。\n\nだから他者理解では、共通点を見つけることと、分からなさを残すことの両方が大切になる。違いをただ尊重すると言うだけではなく、その違いによって生じる不利益や対立をどう扱うかも問われる。関係性とは、独立した個人同士が後から結びつくというより、互いの存在によって自分のあり方も変わる関係を指す。\n\nこの論点を広げる語として「カテゴリー」「他者化」がある。「カテゴリー」は、人や物を一定の特徴によってまとめる分類。「他者化」は、ある人々を「自分たちとは違う存在」として固定し、距離をつくること。文章中でこれらがどう結びつくかを見ると、筆者の整理の仕方が分かる。\n\n文章を読む際に注目したいのは、筆者が違いを「克服すべき壁」としているのか、「残すべきもの」としているのかを見る。相手を理解可能な存在へ回収しているのか、それとも完全には理解できないという前提から関係を考えているのか。この違いが文章の倫理的な立場を決めることが多い。","keywords":[["他者","自分とは異なる経験や立場をもつ相手。"],["異質性","自分や多数派と同じではない性質や経験の違い。"],["カテゴリー","人や物を一定の特徴によってまとめる分類。"],["他者化","ある人々を「自分たちとは違う存在」として固定し、距離をつくること。"],["他者理解","自分とは異なる経験をもつ相手を、違いを残したまま理解しようとすること。"]]},{"id":24,"area":"E","areaName":"人間・自己・他者","title":"承認・自己形成","question":"人は、自分一人で「自分は価値のある存在だ」と確信できるのだろうか。褒められたり、名前を呼ばれたり、役割を認められたりすることで自己像が変わることがある。承認と自己形成はどのように結びついているのか。","body":"承認とは、他者から一人の人間として価値や存在を認められることである。単に褒められることだけではなく、「あなたの意見を聞く」「権利を同じように認める」「役割を任せる」といった行為も承認に含まれる。自己形成は、こうした他者との関係の中で自分のあり方を作っていく過程である。\n\n幼い子どもは、周囲の反応を通して、自分がどんな存在かを学んでいく。大人になっても、学校、職場、友人関係などで受ける評価は自己像に影響する。他者から継続的に無視されたり、否定的なラベルだけを与えられたりすれば、自分自身の評価にも影響が及ぶことがある。\n\nただし、承認を求めることが強すぎると、他人の評価に過度に依存する問題も生じる。SNSの反応のように、数値化された承認が自己評価を左右することもある。一方で、「他人を気にせず自分だけで生きればよい」という考えも、人間が社会的な存在であることを見落とす。\n\nここで「自律」という語も押さえておきたい。自律とは、他者にただ従うのではなく、自分で考え選択すること。この意味を知っておくと、文章中でこの語が担う役割を追いやすくなる。\n\nこの論点を読むときは、個人の自信の問題に縮めない。誰が承認する側に立ち、誰が認められにくいのか、制度的な差がないかを見る。自己形成が他者との関係に依存するなら、承認の分配は社会の問題でもある。","keywords":[["承認","他者を一人の主体として認め、価値や権利をもつ存在として扱うこと。"],["自己形成","他者や社会との関係の中で、自分についての理解を形づくっていくこと。"],["自己評価","自分自身の価値や能力についてもつ評価。"],["自律","他者にただ従うのではなく、自分で考え選択すること。"],["関係","人が他者とのつながりの中で影響を受け、また影響を与えること。"]]},{"id":25,"area":"E","areaName":"人間・自己・他者","title":"意識・心身関係・自己の境界","question":"「心」と「身体」は別々のもののように語られるが、緊張すると心拍が上がり、痛みや疲労が気分を変える。逆に思考が身体の動きを変えることもある。意識と身体はどのような関係にあり、「自分」の境界はどこにあるのか。","body":"意識とは、自分が何かを感じたり考えたりしていることに気づいている状態を指す。心身関係は、思考や感情などの心の働きと、脳や身体の働きがどう結びついているかという問題である。古くから、心と身体を別のものと考える立場と、切り離せないものと考える立場が対立してきた。\n\n身近な経験でも両者は強く結びついている。試験前に不安になると胃が痛くなったり、睡眠不足になると判断力が低下したりする。反対に、呼吸を整えることで緊張がやわらぐこともある。身体は心の入れ物ではなく、意識のあり方に参加していると考えることができる。\n\nさらに、自己の境界も単純ではない。眼鏡やスマートフォンのような道具を使い慣れると、それを身体の延長のように扱うことがある。介助を受けながら生活する場合、自分でできることと他者に支えられてできることの境界も揺れる。\n\nもう一つ鍵になるのが「一人称」である。ここでは、自分自身の痛みや感覚を、本人の立場から直接経験することという意味で使う。この語がどこに置かれるかで、議論の焦点が見えやすい。\n\nこのテーマを扱う文章では、「心が本体で身体は道具」という前提が置かれていないかを見る。筆者が意識を脳内の現象として説明するのか、身体や環境との関係まで含めて捉えるのかによって、人間観は大きく変わる。","keywords":[["意識","自分に何かが見え、感じられ、考えられているという主観的な経験。"],["心身関係","心の働きと身体の状態がどのように結びついているかという関係。"],["一人称","自分自身の痛みや感覚を、本人の立場から直接経験すること。"],["自己","自分を一つの存在として感じ、理解しているまとまり。"],["身体","感覚や行為を通して、世界と関わる基盤となる存在。"]]},{"id":26,"area":"F","areaName":"心理・認知","title":"感情と判断","question":"大事な判断は「感情に流されず、冷静に考えるべきだ」と言われる。しかし、何に腹を立て、何を怖いと感じるかは、何を重要だと見なしているかを示している。感情は判断を邪魔するだけなのだろうか。","body":"感情とは、喜び、怒り、恐れ、悲しみなど、出来事を自分にとってどのような意味があるかという評価を伴う反応である。判断は、複数の情報や価値を比べ、何を信じるか、何を選ぶかを決める働きである。両者は対立するものとして語られやすいが、実際には深く結びついている。\n\nたとえば、危険を感じる恐れがあるから、人は素早く避難できる。誰かの不正に怒るのは、「それは許されない」という価値判断を含んでいる。感情は、何に注意を向けるべきかを知らせる働きをもつ。完全に感情を取り除いた判断が、必ず優れているとは限らない。\n\n一方、強い感情が視野を狭めたり、事実の評価をゆがめたりすることもある。怒っていると相手の言葉を悪意あるものとして読みやすくなり、恐怖が大きいと危険を実際以上に感じることもある。重要なのは、感情を消すことではなく、感情が判断にどう影響しているかを自覚することである。\n\nここで関係する用語が「合理性」「解釈」である。「合理性」は、理由や情報にもとづいて、一貫した判断を行おうとするあり方。「解釈」は、出来事をどのように捉えるかによって、感情の意味や判断が変わること。どの語が原因・結果・評価のどこに置かれているかを見るとよい。\n\n実際の読解では、単純な「感情＝悪、理性＝善」という構図を疑う。筆者が感情を情報として評価しているのか、判断を乱す要因としているのか、その両面を扱っているのかを見る。何を「合理的な判断」と呼んでいるかにも注意したい。","keywords":[["感情","喜び・怒り・恐れなど、出来事への評価を伴う心身の反応。"],["判断","情報や状況をもとに、何が正しいか・望ましいかを決めること。"],["評価","ある出来事や選択肢を、価値ある・危険だなどと捉えること。"],["合理性","理由や情報にもとづいて、一貫した判断を行おうとするあり方。"],["解釈","出来事をどのように捉えるかによって、感情の意味や判断が変わること。"]]},{"id":27,"area":"F","areaName":"心理・認知","title":"欲望・動機・行動形成","question":"自分が「欲しい」と感じるものや「やりたい」と思うことは、本当に自分の内側から自然に生まれているのだろうか。広告、友人、習慣、社会の期待も私たちの選択に影響する。欲望や動機はどのように行動を作るのか。","body":"欲望とは、何かを得たい、したい、避けたいと感じる方向づけである。動機は、実際に行動を起こす理由やきっかけを指す。私たちは、自分の行動を「自分がしたかったから」と説明しがちだが、欲望そのものがどのように作られたかを考えると問題は複雑になる。\n\nたとえば、ある服が欲しいと思うとき、その欲望は商品の機能だけから生まれるわけではない。流行、広告、周囲の人の評価、「こう見られたい」という自己像が関わることがある。人は、他者が欲しがっているものを欲しくなることもある。\n\n動機も一つとは限らない。勉強する理由には、知りたいという興味、成績への不安、将来の目標、親からの期待などが同時に混ざる。本人が説明できる理由が、行動を生み出した全ての原因であるとも限らない。習慣や環境が行動を後押しすることもある。\n\nこの話を読むうえでは「意図」も重要である。意図は、ある行動を実際に行おうとする決定。本文でこの語が出たら、前後の因果や対比と結びつけて読む。\n\n初見の文章にこの論点が出てきたら、「本人が望んだのだから自由な選択だ」とすぐに結論づけない。何が欲望を形成し、どんな選択肢が見えるようになっていたのかを見る。個人の内面と社会的な影響をどのように結びつけているかが読解の焦点になる。","keywords":[["欲望","ある状態や結果を実現したいと望む心の方向。"],["動機","行動を始めたり続けたりする理由や力。"],["目標","実現を目指す、具体的な状態や結果。"],["意図","ある行動を実際に行おうとする決定。"],["習慣","繰り返しによって、特定の状況で起こりやすくなった行動。"],["環境","行動のきっかけや選択のしやすさを左右する外部の条件。"]]},{"id":28,"area":"F","areaName":"心理・認知","title":"無意識・自己の不透明さ","question":"自分の心の中のことなら、自分が一番よく知っていると思いがちである。しかし、なぜその人を苦手だと感じるのか、なぜ同じ失敗を繰り返すのか、自分でも説明できないことがある。無意識という考えは、自己理解をどう変えるのか。","body":"無意識とは、自分でははっきり自覚していないのに、感情や判断、行動へ影響を与える心の働きを指す。すべての心理学が同じ意味で無意識を使うわけではないが、「人は自分の心を完全には透明に理解できない」という点は重要な論点である。\n\nたとえば、ある選択をしたあと、人はもっともらしい理由を説明できる。しかし、実際には先に直感的な反応があり、あとから理由を作っている場合もある。偏見や習慣も、自分では意識していなくても行動へ現れることがある。内省、つまり自分の内面を振り返ることだけで、すべてが分かるとは限らない。\n\nだからといって、「本当の理由はすべて無意識にある」と決めつけるのも危険である。本人が語る理由、行動の記録、環境など複数の手掛かりを合わせて考える必要がある。自己の不透明さを認めることは、自分について何も分からないと諦めることではない。\n\nあわせて「自己知識」「意識に上らない処理」も、このテーマの足場になる。「自己知識」は、自分の感情・欲望・性格・行動などについてもつ理解。「意識に上らない処理」は、本人が過程を自覚しなくても進む知覚や判断の働き。それぞれの役割を押さえておくと、具体例から抽象的な主張へ移りやすい。\n\n文章の論旨を追うときは、筆者が人間をどの程度自己理解できる存在として捉えているかを見る。「自分で選んだ」という説明をそのまま認めるのか、背後の習慣や社会的条件まで探るのか。その人間観が、責任や自由の議論にもつながる。","keywords":[["無意識","心の働きのうち、現在の意識に現れていないもの。"],["内省","自分の感情や思考へ注意を向け、理解しようとすること。"],["自己知識","自分の感情・欲望・性格・行動などについてもつ理解。"],["意識に上らない処理","本人が過程を自覚しなくても進む知覚や判断の働き。"],["理由","自分の判断や行動を説明するために示される根拠。"]]},{"id":29,"area":"F","areaName":"心理・認知","title":"記憶・忘却・再構成","question":"私たちは、過去の出来事を頭の中に保存し、必要なときに取り出しているように感じる。しかし、同じ出来事の記憶が時間とともに変わったり、人によって異なったりする。記憶は過去の正確な記録なのだろうか。","body":"記憶とは、過去の経験を現在に呼び戻し、意味づける働きである。記憶を録画データのように考えると、思い出すことは保存された情報をそのまま再生する作業に見える。しかし実際には、思い出すたびに現在の知識や感情が入り込み、記憶が再構成されることがある。\n\nたとえば、同じ旅行に参加した二人が数年後に話すと、印象に残っている場面が違うことがある。写真を何度も見た結果、実際に見た記憶と写真で知った情報が混ざることもある。「思い出す」という行為そのものが、過去の経験を現在から組み直す働きなのである。\n\n忘却も、単なる失敗とは限らない。すべてを同じ鮮明さで覚えていたら、必要な情報を選ぶことが難しくなる。忘れることで、経験を整理したり、現在の生活に集中したりできる面もある。一方、社会が何を忘れ、何を記念するかという問題は、個人の記憶とは別の政治性をもつ。\n\nさらに「自己理解」という視点がある。ここでいう自己理解とは、自分がどのような経験をし、どのような人間であるかについての理解。この概念を加えると、議論を一段広く捉えられる。\n\n入試評論でも、「記憶＝事実の保存」と置かれていないか確認する。筆者が、記憶の変化や忘却を欠点として捉えるのか、それとも現在から過去を意味づけ直す働きとして捉えるのかを見ると、論旨が分かりやすい。","keywords":[["記憶","過去の経験を保持し、現在において思い出したり利用したりする働き。"],["思い出す","記憶の断片を手掛かりに、過去の経験を現在に呼び戻すこと。"],["忘却","過去の情報が思い出せなくなったり、重要性を失ったりすること。"],["再構成","残っている断片や現在の知識をもとに、過去の出来事を組み直して理解すること。"],["自己理解","自分がどのような経験をし、どのような人間であるかについての理解。"]]},{"id":30,"area":"F","areaName":"心理・認知","title":"認知バイアス・意思決定","question":"私たちは、自分では客観的に考えているつもりでも、同じ情報を見て違う結論にたどり着くことがある。判断には、無意識の偏りや考え方の癖が入り込む。認知バイアスを知ることは、意思決定をどう変えるのだろうか。","body":"認知バイアスとは、情報を受け取り、記憶し、判断するときに生じやすい一定の偏りのことである。人間は、毎回すべての情報を検討してから決めることはできない。限られた時間の中で素早く判断するために、経験則や直感を使う。その便利な仕組みが、時に判断の偏りを生む。\n\nたとえば、自分の考えに合う情報ばかり集め、反対の証拠を軽く見ることがある。最初に示された数字が、その後の見積もりに影響することもある。こうした偏りは、知識がない人だけに起こるものではない。専門家でも、状況によって影響を受ける。\n\nただし、認知バイアスを知れば完全に合理的になれるわけではない。「相手はバイアスに陥っているが、自分は正しい」と考えること自体が新しい偏りになる。重要なのは、判断の手順を工夫し、複数の人で検討したり、反対の証拠を意識的に探したりすることである。\n\nここで「限定合理性」という語も押さえておきたい。限定合理性とは、人間の時間・情報・認知能力には限界があることを前提に合理性を考える見方。この意味を知っておくと、文章中でこの語が担う役割を追いやすくなる。\n\nここまでを踏まえて文章を読むなら、「人間は合理的に選ぶ」という前提が置かれているかを見る。筆者が合理性をどこまで認め、どこに限界を見ているかを追うとよい。個人の努力だけでなく、判断を支える制度や仕組みまで議論が広がっているかにも注意する。","keywords":[["合理性","目的や根拠に照らして、筋道の通った判断や選択を行うこと。"],["判断","複数の情報や可能性から、何が妥当かを決める働き。"],["直感","細かな推論を意識せず、素早く生じる判断や理解。"],["認知バイアス","判断が一定の方向へ偏りやすくなる傾向。"],["限定合理性","人間の時間・情報・認知能力には限界があることを前提に合理性を考える見方。"]]},{"id":31,"area":"G","areaName":"身体・感覚・食","title":"身体性と世界理解","question":"私たちは、頭の中だけで世界を理解しているわけではない。重い物を持った経験、寒さ、疲労、距離感など、身体を通して得た感覚がものの見方を変える。身体性という考えは、知識や理解をどう捉え直すのか。","body":"身体性とは、人間の認識や行為が、身体をもつことと切り離せないという考え方である。私たちは目で見るだけでなく、手を伸ばし、歩き、触れ、姿勢を変えながら世界を理解している。知覚は、外から情報を受け取るだけの受動的な働きではない。\n\nたとえば、「この坂は急だ」と感じる度合いは、見る人の疲労や体力によって変わることがある。遠くにある物を見たときも、自分がそこまで歩けるかという身体感覚が距離の捉え方に関わる。身体は、世界を測る一つの基準になっている。\n\nまた、身体を通した経験には、言葉にしにくい知識が含まれる。自転車のバランスや包丁の力加減は、説明を読んだだけでは身につかない。身体を動かす中で、環境との関係を調整しながら理解していく必要がある。\n\nもう一つ鍵になるのが「行為可能性」である。ここでは、ある身体と環境の組み合わせによって、可能になる行動の範囲という意味で使う。この語がどこに置かれるかで、議論の焦点が見えやすい。\n\n本文中にこの概念が現れたら、「認識は頭の中だけで行われる」という前提を疑う。筆者が身体を、意識に従う道具としているのか、世界理解を支える主体の一部としているのかを見る。身体と環境の関係を読むことで、抽象的な人間観が具体化する。","keywords":[["身体性","人間が身体をもつ存在として世界とかかわるあり方。"],["知覚","感覚情報をもとに、物や出来事を捉える働き。"],["行為","身体を通して環境へ働きかけること。"],["環境","人間が生活し、行為する周囲の物や状況。"],["行為可能性","ある身体と環境の組み合わせによって、可能になる行動の範囲。"]]},{"id":32,"area":"G","areaName":"身体・感覚・食","title":"感覚・知覚・経験","question":"同じ景色を見ても、ある人は鳥の声に気づき、別の人は看板の文字に目を向ける。感覚器に同じ情報が入っても、私たちの経験は同じにならない。感覚と知覚はどう違い、経験や知識は「見えるもの」にどう影響するのか。","body":"感覚とは、光、音、温度、圧力などの刺激を身体が受け取る働きである。知覚は、その感覚情報を整理し、「これは人の顔だ」「遠くで車が走っている」と意味のあるものとして捉える働きである。私たちは刺激をそのまま受け取るのではなく、選び、まとめ、解釈している。\n\nたとえば、同じ星空を見ても、星座を知っている人には特定の形がすぐ見える。音楽経験のある人は、他の人には一つの響きに聞こえる音から複数の楽器を聞き分けられることがある。経験は、後から知識を加えるだけでなく、何に気づけるかそのものを変える。\n\nそのため、「見たから事実だ」と単純には言えない。目撃者の証言でも、注意を向けていた場所や期待によって記憶は変わる。ただし、知覚が主観的だから現実が存在しないということでもない。外界の刺激と、受け手の身体・経験の両方が関わって知覚が成立する。\n\nここで関係する用語が「文脈」「錯覚」である。「文脈」は、知覚や理解に影響する周囲の状況や前後関係。「錯覚」は、実際の刺激と異なるように知覚される現象。どの語が原因・結果・評価のどこに置かれているかを見るとよい。\n\n読解の場面では、「世界はそのまま見えている」という前提に注目する。筆者が、経験によって見え方が変わることを強調しているのか、共通の知覚可能性を重視しているのかを読むと、認識論の方向がつかみやすい。","keywords":[["感覚","光・音・圧力などの刺激を身体が受け取る働き。"],["知覚","感覚情報をもとに、物や出来事をまとまりとして捉える働き。"],["注意","多くの情報の中から、特定の対象へ意識を向けること。"],["文脈","知覚や理解に影響する周囲の状況や前後関係。"],["錯覚","実際の刺激と異なるように知覚される現象。"]]},{"id":33,"area":"G","areaName":"身体・感覚・食","title":"行為・技能・身体知","question":"自転車の乗り方を文章で完璧に説明されても、それだけで乗れるようにはならない。反対に、上手にできる人が理由をうまく言葉にできないこともある。技能や身体知には、説明できる知識とは違うどんな特徴があるのか。","body":"技能とは、練習を通して身につけた、ある行為をうまく行う能力である。実践知や身体知という言葉は、行為の中で働く、言葉だけでは完全に表しにくい知識を指す。料理、運転、スポーツ、楽器演奏などでは、説明を理解することと実際にできることは別である。\n\nたとえば、野球のバットを振る角度を数値で教えられても、実際の球に合わせて身体を
